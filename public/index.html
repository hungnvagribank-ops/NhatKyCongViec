<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ Nhật Ký Công Việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEAE2; --paper-dark:#E1DCCE; --card:#FBFAF6;
    --ink:#232C29; --ink-soft:#63695F; --line:#C9C2AC;
    --accent:#3D6B54; --accent-soft:#DCE7DD;
    --gold:#AD7F35; --gold-soft:#F1E4C4;
    --danger:#9C3D34; --danger-soft:#F1DEDA;
    --brand-red:#8E1C28; --brand-red-dark:#6B121C; --brand-gold:#C9A227;
    --radius:3px;
    --font-display:'Source Serif 4', Georgia, serif;
    --font-body:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}
  #app{min-height:100vh;}
  .hidden{display:none !important;}

  /* Login */
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(35,44,41,0.035) 40px), var(--paper);}
  .login-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:0;overflow:hidden;}
  .login-banner{width:100%;display:block;}
  .login-red-bar{background:linear-gradient(135deg,var(--brand-red),var(--brand-red-dark));border-bottom:2px solid var(--brand-gold);padding:16px 32px;}
  .login-red-bar span{color:#fff;font-family:var(--font-display);font-size:23px;font-weight:600;letter-spacing:.01em;}
  .login-card-body{padding:24px 32px 32px;}
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 6px;}
  .title-lg{font-family:var(--font-display);font-size:26px;font-weight:600;margin:0 0 4px;}
  .sub{font-size:13px;color:var(--ink-soft);margin:0 0 22px;line-height:1.5;}
  .login-card-body input:focus{outline:2px solid var(--brand-red);outline-offset:1px;border-color:var(--brand-red);}
  .login-card-body .btn--primary{background:var(--brand-red);}
  .login-card-body .btn--primary:hover{background:var(--brand-red-dark);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .field select,.field input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;font-family:var(--font-body);font-size:14px;color:var(--ink);}
  .field select:focus,.field input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .btn{cursor:pointer;font-family:var(--font-body);font-size:14px;font-weight:500;border-radius:var(--radius);border:1px solid transparent;padding:10px 16px;}
  .btn--primary{background:var(--accent);color:#fff;width:100%;}
  .btn--primary:hover{background:#335a45;}
  .btn--ghost{background:transparent;border-color:var(--line);color:var(--ink);}
  .btn--ghost:hover{background:var(--paper-dark);}
  .btn--danger{background:transparent;border-color:var(--danger);color:var(--danger);}
  .btn--danger:hover{background:var(--danger-soft);}
  .btn--sm{padding:6px 12px;font-size:13px;}
  .login-hint{margin-top:18px;padding:12px 13px;background:var(--paper-dark);border-radius:var(--radius);font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);line-height:1.6;}
  .login-hint b{color:var(--ink);}
  .error-msg{background:var(--danger-soft);color:var(--danger);border-radius:var(--radius);padding:9px 12px;font-size:13px;margin-bottom:14px;}
  .ok-msg{background:var(--accent-soft);color:var(--accent);border-radius:var(--radius);padding:9px 12px;font-size:13px;margin-bottom:14px;}

  /* Shell */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--card);}
  .brand{display:flex;align-items:center;gap:14px;}
  .stamp{width:52px;height:52px;flex-shrink:0;}
  .stamp img{width:100%;height:100%;object-fit:contain;display:block;}
  .brand-title{font-family:var(--font-display);font-size:19px;font-weight:600;margin:0;}
  .brand-sub{font-size:12px;color:var(--ink-soft);margin:2px 0 0;}
  .user-area{display:flex;align-items:center;gap:10px;}
  .user-chip{text-align:right;}
  .user-name{font-size:14px;font-weight:600;}
  .user-title{font-size:12px;color:var(--ink-soft);}
  .role-tag{display:inline-block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:2px;margin-top:3px;}
  .role-tag--nhan_vien{background:var(--accent-soft);color:var(--accent);}
  .role-tag--truong_pho{background:var(--gold-soft);color:var(--gold);}
  .role-tag--bgd{background:#233c2c;color:#F1E4C4;}
  .tabs{display:flex;gap:4px;padding:0 28px;border-bottom:2px solid var(--brand-gold);background:linear-gradient(135deg,var(--brand-red),var(--brand-red-dark));overflow-x:auto;}
  .tab{padding:12px 16px;font-size:13.5px;color:rgba(255,255,255,0.75);cursor:pointer;border-bottom:2px solid transparent;font-weight:500;white-space:nowrap;}
  .tab.active{color:#fff;border-bottom-color:var(--brand-gold);font-weight:600;}
  .tab:hover:not(.active){color:#fff;}
  .tabs-spacer{flex:1;}
  .btn-export{align-self:center;margin:8px 0;padding:7px 14px;font-size:12.5px;font-weight:500;border-radius:var(--radius);
    background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.4);cursor:pointer;white-space:nowrap;font-family:var(--font-body);}
  .btn-export:hover{background:rgba(255,255,255,0.22);}
  .main{padding:26px 28px 60px;max-width:1080px;margin:0 auto;}

  /* My log */
  .my-log-layout{display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start;}
  .day-list{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--card);}
  .day-item{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);color:var(--ink-soft);}
  .day-item:last-child{border-bottom:none;}
  .day-item:hover{background:var(--paper-dark);}
  .day-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .day-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-left:8px;}
  .cal-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-title{font-family:var(--font-display);font-weight:600;font-size:14.5px;color:var(--ink);}
  .cal-nav{display:flex;gap:4px;}
  .cal-nav button{width:24px;height:24px;border:1px solid var(--line);background:#fff;border-radius:var(--radius);cursor:pointer;color:var(--ink-soft);font-size:12px;line-height:1;}
  .cal-nav button:hover{background:var(--paper-dark);}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;}
  .cal-weekdays span{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-soft);text-align:center;text-transform:uppercase;display:block;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-day{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12.5px;border-radius:50%;cursor:pointer;color:var(--ink);}
  .cal-day.other-month{color:var(--line);cursor:default;}
  .cal-day.future{color:var(--ink);cursor:not-allowed;}
  .cal-day.future:hover{background:none;}
  .cal-day:not(.other-month):not(.future):hover{background:var(--paper-dark);}
  .cal-day.selected{background:var(--brand-red);color:#fff;font-weight:600;}
  .cal-day.today-marker{box-shadow:inset 0 0 0 1px var(--brand-gold);}
  .cal-day .has-dot{position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--brand-gold);}
  .cal-day.selected .has-dot{background:#fff;}
  .cal-today-btn{margin-top:10px;width:100%;padding:7px;font-size:12px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;cursor:pointer;color:var(--brand-red);font-weight:500;font-family:var(--font-body);}
  .cal-today-btn:hover{background:var(--paper-dark);}
  .backup-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-top:24px;}
  .backup-card h3{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--brand-red);margin:0 0 6px;}
  .backup-card p{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;line-height:1.6;}
  .backup-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
  .backup-row input[type=file]{font-size:12.5px;}
  .backup-status{font-size:12.5px;color:var(--accent);font-weight:500;}
  .backup-status.error{color:var(--danger);}
  .backup-warning{background:var(--gold-soft);color:var(--gold);border-radius:var(--radius);padding:9px 12px;font-size:12px;margin-bottom:14px;line-height:1.5;}
  .session-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .session-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .session-title{font-family:var(--font-display);font-size:17px;font-weight:700;color:var(--brand-red);}
  .session-cap{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);}
  .session-cap.over{color:var(--danger);font-weight:600;}
  .entry-row{display:grid;grid-template-columns:1fr 190px 90px 34px;gap:8px;margin-bottom:8px;align-items:center;}
  .entry-row input,.entry-row select{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:13.5px;font-family:var(--font-body);background:#fff;color:var(--ink);}
  .entry-remove{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:var(--radius);cursor:pointer;color:var(--danger);font-size:16px;line-height:1;}
  .entry-remove:hover{background:var(--danger-soft);}
  .entry-add-row{display:grid;grid-template-columns:1fr 190px 90px 80px;gap:8px;margin-top:10px;}
  .entry-add-row input,.entry-add-row select{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:13.5px;background:#fff;color:var(--ink);}
  .empty-entries{font-size:12.5px;color:var(--ink-soft);font-style:italic;margin-bottom:8px;}
  .save-bar{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:6px;}
  .save-flash{font-size:12.5px;color:var(--accent);font-weight:500;}

  /* Report / users */
  .filters-bar{display:flex;gap:14px;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;}
  .filters-bar .field{margin-bottom:0;min-width:170px;}
  .data-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .data-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-family:var(--font-mono);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--paper-dark);}
  .data-table td{padding:12px 14px;font-size:13.5px;border-bottom:1px solid var(--line);vertical-align:top;}
  .data-table tr:last-child td{border-bottom:none;}
  .emp-name{font-weight:600;}
  .emp-dept{font-size:11.5px;color:var(--ink-soft);}
  .cell-empty{color:var(--ink-soft);font-style:italic;}
  .pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:2px;background:var(--paper-dark);margin:1px 3px 1px 0;}
  .toolbar-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .section-title{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--brand-red);margin:0;}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(35,44,41,0.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;}
  .modal-card{width:100%;max-width:420px;background:var(--card);border-radius:var(--radius);padding:26px;border:1px solid var(--line);}
  .modal-title{font-family:var(--font-display);font-size:19px;font-weight:600;margin:0 0 16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  @media(max-width:720px){
    .my-log-layout{grid-template-columns:1fr;}
    .day-list{display:flex;overflow-x:auto;}
    .day-item{border-bottom:none;border-right:1px solid var(--line);white-space:nowrap;}
    .topbar{padding:16px;} .main{padding:18px 16px 50px;} .tabs{padding:0 16px;}
    .data-table{display:block;overflow-x:auto;}
    .entry-row,.entry-add-row{grid-template-columns:1fr 34px;}
    .entry-row select,.entry-add-row select,.entry-row .entry-min,.entry-add-row .new-min{grid-column:1 / -1;}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div id="app"></div>

<script>
/* ============ Cấu hình & helper ============ */
const SESSION_KEYS = ['morning','afternoon','overtime'];
const SESSION_LABEL = {morning:'Buổi sáng', afternoon:'Buổi chiều', overtime:'Ngoài giờ'};
const SESSION_CAP = {morning:240, afternoon:240, overtime:720};
const ROLE_LABEL = {nhan_vien:'Nhân viên', truong_pho:'Trưởng/Phó phòng', bgd:'Ban giám đốc'};
const STATUS_OPTIONS = [
  {value:'hoan_thanh_dung_han', label:'Hoàn thành đúng hạn'},
  {value:'hoan_thanh_sau_han', label:'Hoàn thành sau hạn'},
  {value:'dang_thuc_hien_dung_han', label:'Đang thực hiện đúng hạn'},
  {value:'dang_thuc_hien_qua_han', label:'Đang thực hiện quá hạn'},
  {value:'thuong_xuyen', label:'Công việc thường xuyên'}
];
const STATUS_LABEL = Object.fromEntries(STATUS_OPTIONS.map(o=>[o.value,o.label]));

function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function shiftDate(base,delta){ const d=new Date(base); d.setDate(d.getDate()+delta); return d; }
function displayDate(iso){ const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtHM(min){ const h=Math.floor(min/60), m=min%60; return h>0 ? `${h}h${m>0?m+'p':''}` : `${m}p`; }

async function api(path, options={}){
  const headers = Object.assign({'Content-Type':'application/json'}, options.headers||{});
  if(state.token) headers['Authorization'] = 'Bearer '+state.token;
  const res = await fetch(path, Object.assign({}, options, {headers}));
  let data=null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((data && data.error) || 'Đã xảy ra lỗi, vui lòng thử lại.');
  return data;
}

/* ============ Trạng thái ============ */
const state = {
  token: localStorage.getItem('nkcv_token') || null,
  user: JSON.parse(localStorage.getItem('nkcv_user') || 'null'),
  loginError:'', loginBusy:false,
  tab:'my-log',
  myDate: todayISO(),
  myEntries: {morning:[], afternoon:[], overtime:[]},
  myFlash:'', myLoading:false,
  calYear: new Date().getFullYear(), calMonth: new Date().getMonth()+1, monthHasData: new Set(),
  reportFrom: todayISO(), reportTo: todayISO(), reportDept:'all', reportRows:[], departments:[], reportLoading:false, reportExpanded: new Set(),
  users:[], userModal:null, /* null | {mode:'add'} | {mode:'edit', data:{...}} */ userModalError:'',
  pwModalOpen:false, pwError:'', pwOk:false
};

const app = document.getElementById('app');

/* ============ Render root ============ */
function render(){
  if(!state.token || !state.user){ renderLogin(); return; }
  renderShell();
}

/* ============ Login ============ */
function renderLogin(){
  app.innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <img class="login-banner" src="agribank-banner.png" alt="Agribank — Nhật ký công việc" />
        <div class="login-red-bar"><span>Đăng nhập</span></div>
        <div class="login-card-body">
          ${state.loginError ? `<div class="error-msg">${esc(state.loginError)}</div>` : ''}
          <div class="field"><label for="li-user">Tên đăng nhập</label><input id="li-user" type="text" autocomplete="username" /></div>
          <div class="field"><label for="li-pass">Mật khẩu</label><input id="li-pass" type="password" autocomplete="current-password" /></div>
          <button class="btn btn--primary" id="btn-login" ${state.loginBusy?'disabled':''}>${state.loginBusy?'Đang đăng nhập...':'Đăng nhập'}</button>
        </div>
      </div>
    </div>`;
  document.getElementById('btn-login').addEventListener('click', doLogin);
  document.getElementById('li-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

async function doLogin(){
  const username = document.getElementById('li-user').value.trim().toLowerCase();
  const password = document.getElementById('li-pass').value;
  if(!username || !password){ state.loginError='Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.'; render(); return; }
  state.loginBusy = true; render();
  try{
    const data = await api('/api/login', {method:'POST', body: JSON.stringify({username,password})});
    state.token = data.token; state.user = data.user;
    localStorage.setItem('nkcv_token', state.token);
    localStorage.setItem('nkcv_user', JSON.stringify(state.user));
    state.loginError=''; state.loginBusy=false; state.tab='my-log';
    await bootAfterLogin();
  }catch(e){
    state.loginBusy=false; state.loginError = e.message; render();
  }
}

function doLogout(){
  state.token=null; state.user=null;
  localStorage.removeItem('nkcv_token'); localStorage.removeItem('nkcv_user');
  render();
}

async function bootAfterLogin(){
  await Promise.all([loadMyLog(state.myDate), loadMonthLogs(state.calYear, state.calMonth)]);
  render();
}

/* ============ Shell ============ */
function renderShell(){
  const u = state.user;
  const canSeeReport = u.role !== 'nhan_vien';
  const canManageUsers = u.role === 'bgd';

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="stamp"><img src="agribank-logo.png" alt="Agribank" /></div>
        <div><p class="brand-title">Sổ Nhật Ký Công Việc</p><p class="brand-sub">${esc(u.department || 'Ban giám đốc')}</p></div>
      </div>
      <div class="user-area">
        <div class="user-chip">
          <div class="user-name">${esc(u.fullname)}</div>
          <span class="role-tag role-tag--${u.role}">${ROLE_LABEL[u.role]}</span>
        </div>
        <button class="btn btn--ghost btn--sm" id="btn-pw">Đổi mật khẩu</button>
        <button class="btn btn--ghost btn--sm" id="btn-logout">Đăng xuất</button>
      </div>
    </div>
    <div class="tabs">
      <div class="tab ${state.tab==='my-log'?'active':''}" data-tab="my-log">Nhật ký của tôi</div>
      ${canSeeReport ? `<div class="tab ${state.tab==='report'?'active':''}" data-tab="report">Báo cáo</div>` : ''}
      ${canManageUsers ? `<div class="tab ${state.tab==='users'?'active':''}" data-tab="users">Quản lý người dùng</div>` : ''}
      <div class="tabs-spacer"></div>
      <button class="btn-export" id="btn-export-excel">⬇ Xuất dữ liệu (Excel)</button>
    </div>
    <div class="main" id="main"></div>
    ${state.pwModalOpen ? renderPasswordModal() : ''}
    ${state.userModal ? renderUserModal() : ''}
  `;
  document.getElementById('btn-logout').addEventListener('click', doLogout);
  document.getElementById('btn-pw').addEventListener('click', ()=>{ state.pwModalOpen=true; state.pwError=''; state.pwOk=false; render(); });
  document.getElementById('btn-export-excel').addEventListener('click', exportMyDataExcel);
  document.querySelectorAll('.tab').forEach(el=>{
    el.addEventListener('click', async ()=>{
      state.tab = el.dataset.tab;
      if(state.tab==='report'){ state.reportLoading=true; render(); await loadReport(); }
      else if(state.tab==='users'){ await loadUsers(); }
      render();
    });
  });

  if(state.tab==='my-log') renderMyLog();
  else if(state.tab==='report') renderReport();
  else if(state.tab==='users') renderUsers();

  bindModalEvents();
}

/* ============ Tab: Nhật ký của tôi ============ */
async function loadMyLog(date){
  state.myLoading = true;
  try{
    const data = await api('/api/logs/'+date);
    state.myEntries = { morning: data.morning||[], afternoon: data.afternoon||[], overtime: data.overtime||[] };
  }catch(e){ state.myEntries = {morning:[],afternoon:[],overtime:[]}; }
  state.myLoading = false;
}

async function loadMonthLogs(year, month){
  try{
    const data = await api(`/api/logs-month?year=${year}&month=${month}`);
    const set = new Set();
    (data.logs||[]).forEach(l=>{ if((l.morning.length+l.afternoon.length+l.overtime.length)>0) set.add(l.date); });
    state.monthHasData = set;
  }catch(e){ state.monthHasData = new Set(); }
}
const MONTH_NAMES = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
function buildCalendarCells(year, month){
  const firstWeekday = new Date(year, month-1, 1).getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  const daysInPrevMonth = new Date(year, month-1, 0).getDate();
  const cells = [];
  for(let i=firstWeekday-1;i>=0;i--) cells.push({day: daysInPrevMonth-i, other:true});
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({day:d, other:false, iso});
  }
  const trailing = (7 - (cells.length % 7)) % 7;
  for(let d=1; d<=trailing; d++) cells.push({day:d, other:true});
  return cells;
}
function renderCalendar(){
  const cells = buildCalendarCells(state.calYear, state.calMonth);
  const todayIso = todayISO();
  return `
    <div class="cal-card">
      <div class="cal-head">
        <span class="cal-title">${MONTH_NAMES[state.calMonth-1]} ${state.calYear}</span>
        <div class="cal-nav">
          <button data-cal-nav="-1" title="Tháng trước">‹</button>
          <button data-cal-nav="1" title="Tháng sau">›</button>
        </div>
      </div>
      <div class="cal-weekdays"><span>CN</span><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span></div>
      <div class="cal-grid">
        ${cells.map(c=>{
          if(c.other) return `<div class="cal-day other-month">${c.day}</div>`;
          const isFuture = c.iso > todayIso;
          const isSelected = c.iso === state.myDate;
          const isToday = c.iso === todayIso;
          const hasDot = state.monthHasData.has(c.iso);
          const cls = ['cal-day'];
          if(isFuture) cls.push('future');
          if(isSelected) cls.push('selected');
          if(isToday) cls.push('today-marker');
          return `<div class="${cls.join(' ')}" ${isFuture?'':`data-date="${c.iso}"`}>${c.day}${hasDot && !isSelected ? '<span class="has-dot"></span>':''}</div>`;
        }).join('')}
      </div>
      <button class="cal-today-btn" id="cal-today-btn">Về hôm nay</button>
    </div>`;
}
function bindCalendarEvents(){
  document.querySelectorAll('.cal-day[data-date]').forEach(el=>{
    el.addEventListener('click', async ()=>{ state.myDate = el.dataset.date; state.myFlash=''; await loadMyLog(state.myDate); render(); });
  });
  document.querySelectorAll('[data-cal-nav]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const delta = Number(btn.dataset.calNav);
      let m = state.calMonth + delta, y = state.calYear;
      if(m<1){ m=12; y--; } if(m>12){ m=1; y++; }
      state.calMonth=m; state.calYear=y;
      await loadMonthLogs(y,m);
      render();
    });
  });
  const todayBtn = document.getElementById('cal-today-btn');
  if(todayBtn) todayBtn.addEventListener('click', async ()=>{
    const t = new Date();
    state.calYear = t.getFullYear(); state.calMonth = t.getMonth()+1;
    state.myDate = todayISO(); state.myFlash='';
    await Promise.all([loadMyLog(state.myDate), loadMonthLogs(state.calYear, state.calMonth)]);
    render();
  });
}

function renderSessionCard(sk){
  const entries = state.myEntries[sk] || [];
  const total = entries.reduce((s,e)=>s+(Number(e.minutes)||0),0);
  const cap = SESSION_CAP[sk];
  return `
    <div class="session-card" data-session="${sk}">
      <div class="session-head">
        <span class="session-title">${SESSION_LABEL[sk]}</span>
        <span class="session-cap ${total>cap?'over':''}">${fmtHM(total)} / tối đa ${fmtHM(cap)}</span>
      </div>
      ${entries.length===0 ? `<div class="empty-entries">Chưa có mục nào.</div>` : entries.map((e,i)=>`
        <div class="entry-row" data-idx="${i}">
          <input type="text" class="entry-desc" value="${esc(e.desc||'')}" placeholder="Mô tả công việc" />
          <select class="entry-status">
            ${STATUS_OPTIONS.map(o=>`<option value="${o.value}" ${e.status===o.value?'selected':''}>${o.label}</option>`).join('')}
          </select>
          <input type="number" min="0" class="entry-min" value="${Number(e.minutes)||0}" placeholder="Phút" />
          <button class="entry-remove" data-remove="${i}" title="Xoá mục">×</button>
        </div>`).join('')}
      <div class="entry-add-row">
        <input type="text" class="new-desc" placeholder="Mô tả công việc mới" />
        <select class="new-status">
          ${STATUS_OPTIONS.map(o=>`<option value="${o.value}">${o.label}</option>`).join('')}
        </select>
        <input type="number" min="0" class="new-min" placeholder="Phút" />
        <button class="btn btn--ghost btn--sm" data-add="1">+ Thêm</button>
      </div>
    </div>`;
}

function bindSessionEvents(){
  document.querySelectorAll('.session-card').forEach(card=>{
    const sk = card.dataset.session;
    card.querySelectorAll('.entry-desc').forEach((inp,i)=>inp.addEventListener('input', ()=>{ state.myEntries[sk][i].desc = inp.value; }));
    card.querySelectorAll('.entry-status').forEach((sel,i)=>sel.addEventListener('change', ()=>{ state.myEntries[sk][i].status = sel.value; }));
    card.querySelectorAll('.entry-min').forEach((inp,i)=>inp.addEventListener('input', ()=>{ state.myEntries[sk][i].minutes = Number(inp.value)||0; updateCapDisplay(card, sk); }));
    card.querySelectorAll('[data-remove]').forEach(btn=>btn.addEventListener('click', ()=>{ state.myEntries[sk].splice(Number(btn.dataset.remove),1); renderMyLog(); }));
    card.querySelector('[data-add]').addEventListener('click', ()=>{
      const desc = card.querySelector('.new-desc').value.trim();
      const status = card.querySelector('.new-status').value;
      const minutes = Number(card.querySelector('.new-min').value)||0;
      if(!desc || minutes<=0) return;
      state.myEntries[sk].push({desc, status, minutes});
      renderMyLog();
    });
  });
}
function updateCapDisplay(card, sk){
  const total = state.myEntries[sk].reduce((s,e)=>s+(Number(e.minutes)||0),0);
  const cap = SESSION_CAP[sk];
  const capEl = card.querySelector('.session-cap');
  capEl.textContent = `${fmtHM(total)} / tối đa ${fmtHM(cap)}`;
  capEl.classList.toggle('over', total>cap);
}

async function exportMyDataExcel(){
  if(typeof XLSX === 'undefined'){ alert('Không tải được thư viện xuất Excel, vui lòng kiểm tra kết nối mạng và thử lại.'); return; }
  let logsData;
  try{
    const data = await api('/api/logs?limit=366');
    logsData = data.logs || [];
  }catch(e){ alert('Không thể lấy dữ liệu: ' + e.message); return; }

  const rows = [];
  logsData
    .slice()
    .sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0))
    .forEach(entry=>{
      SESSION_KEYS.forEach(sk=>{
        (entry[sk] || []).forEach(item=>{
          rows.push({
            'Ngày tháng': displayDate(entry.date),
            'Công việc khai trong Sổ nhật ký': item.desc || '',
            'Trạng thái công việc': STATUS_LABEL[item.status] || '',
            'Thời gian (phút)': Number(item.minutes) || 0
          });
        });
      });
    });

  if(rows.length === 0){ alert('Chưa có dữ liệu nhật ký để xuất.'); return; }

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:14},{wch:50},{wch:26},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Nhật ký công việc');
  const fileName = `nhat-ky-cong-viec_${state.user.username}_${todayISO()}.xlsx`;
  XLSX.writeFile(wb, fileName);
}

async function saveMyLog(){
  for(const sk of SESSION_KEYS){
    const total = state.myEntries[sk].reduce((s,e)=>s+(Number(e.minutes)||0),0);
    if(total > SESSION_CAP[sk]){ state.myFlash=''; alert(`${SESSION_LABEL[sk]} vượt quá thời lượng tối đa (${fmtHM(SESSION_CAP[sk])}).`); return; }
  }
  try{
    await api('/api/logs/'+state.myDate, {method:'PUT', body: JSON.stringify(state.myEntries)});
    state.myFlash = 'Đã lưu ✓';
    await loadMonthLogs(state.calYear, state.calMonth);
    render();
  }catch(e){ alert(e.message); }
}

async function loadReport(){
  try{

    if(state.user.role==='bgd') url += `&department=${encodeURIComponent(state.reportDept)}`;
    const data = await api(url);
    state.reportRows = data.rows; state.departments = data.departments;

}

function rowTotalMinutes(days){
  return (days||[]).reduce((sum,d)=> sum + SESSION_KEYS.reduce((s,sk)=> s+(d[sk]||[]).reduce((a,e)=>a+(Number(e.minutes)||0),0), 0), 0);
}

                  <thead><tr><th>Ngày</th><th>Buổi sáng</th><th>Buổi chiều</th><th>Ngoài giờ</th></tr></thead>
                  <tbody>
                    ${r.days.map(d=>`<tr>

  document.getElementById('rep-from').addEventListener('change', async e=>{ state.reportFrom=e.target.value; state.reportLoading=true; render(); await loadReport(); render(); });

  const deptSel = document.getElementById('rep-dept');
  if(deptSel) deptSel.addEventListener('change', async e=>{ state.reportDept=e.target.value; state.reportLoading=true; render(); await loadReport(); render(); });
  document.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const u = btn.dataset.toggle;
      if(state.reportExpanded.has(u)) state.reportExpanded.delete(u); else state.reportExpanded.add(u);

function renderEntryCell(entries){
  if(!entries || entries.length===0) return `<span class="cell-empty">Chưa ghi nhận</span>`;
  return entries.map(e=>`<span class="pill">${esc(e.desc||'(không có mô tả)')} · ${esc(STATUS_LABEL[e.status]||'—')} · ${fmtHM(Number(e.minutes)||0)}</span>`).join(' ');
}

async function exportAllDataExcel(){
  const statusEl = document.getElementById('export-status');
  if(typeof XLSX === 'undefined'){ statusEl.textContent = 'Không tải được thư viện Excel.'; statusEl.classList.add('error'); return; }
  statusEl.classList.remove('error'); statusEl.textContent = 'Đang xuất...';
  try{
    const data = await api('/api/admin/export');
    const usersRows = (data.users||[]).map(u=>({
      username: u.username, password_hash: u.password_hash, fullname: u.fullname, role: u.role, department: u.department||''
    }));
    const logsRows = (data.logs||[]).map(l=>({
      username: l.username, log_date: l.log_date,
      morning: JSON.stringify(l.morning||[]), afternoon: JSON.stringify(l.afternoon||[]), overtime: JSON.stringify(l.overtime||[])
    }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(usersRows), 'Users');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(logsRows), 'Logs');
    XLSX.writeFile(wb, `backup_so-nhat-ky-cong-viec_${todayISO()}.xlsx`);
    statusEl.textContent = `Đã xuất ✓ (${usersRows.length} người dùng, ${logsRows.length} bản ghi nhật ký)`;
  }catch(e){ statusEl.classList.add('error'); statusEl.textContent = 'Lỗi: ' + e.message; }
}

async function restoreAllDataExcel(){
  const statusEl = document.getElementById('restore-status');
  const fileInput = document.getElementById('restore-file');
  statusEl.classList.remove('error');
  if(typeof XLSX === 'undefined'){ statusEl.textContent = 'Không tải được thư viện Excel.'; statusEl.classList.add('error'); return; }
  const file = fileInput.files[0];
  if(!file){ statusEl.textContent = 'Vui lòng chọn file backup (.xlsx) trước.'; statusEl.classList.add('error'); return; }
  if(!confirm('Khôi phục sẽ GHI ĐÈ dữ liệu người dùng và nhật ký trùng khớp trong file lên dữ liệu hiện tại. Bạn chắc chắn muốn tiếp tục?')) return;
  statusEl.textContent = 'Đang đọc file...';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const usersSheet = wb.Sheets['Users'];
    const logsSheet = wb.Sheets['Logs'];
    if(!usersSheet || !logsSheet) throw new Error('File không đúng định dạng (thiếu sheet Users hoặc Logs).');
    const usersRows = XLSX.utils.sheet_to_json(usersSheet);
    const logsRowsRaw = XLSX.utils.sheet_to_json(logsSheet);
    const logsRows = logsRowsRaw.map(r=>({
      username: r.username, log_date: r.log_date,
      morning: JSON.parse(r.morning||'[]'), afternoon: JSON.parse(r.afternoon||'[]'), overtime: JSON.parse(r.overtime||'[]')
    }));
    statusEl.textContent = 'Đang khôi phục...';
    const res = await api('/api/admin/import', {method:'POST', body: JSON.stringify({users: usersRows, logs: logsRows})});
    statusEl.textContent = `Khôi phục thành công ✓ (${res.usersImported} người dùng, ${res.logsImported} bản ghi nhật ký)`;
    fileInput.value = '';
    await loadUsers(); render();
  }catch(e){ statusEl.classList.add('error'); statusEl.textContent = 'Lỗi: ' + e.message; }
}

        <select id="um-role">
          <option value="nhan_vien" ${d.role==='nhan_vien'?'selected':''}>Nhân viên</option>
          <option value="truong_pho" ${d.role==='truong_pho'?'selected':''}>Trưởng/Phó phòng</option>
          <option value="bgd" ${d.role==='bgd'?'selected':''}>Ban giám đốc</option>
        </select></div>
      <div class="field" id="um-dept-field"><label>Phòng ban</label>
        <select id="um-department">
          ${state.departments.map(dep=>`<option value="${esc(dep)}" ${d.department===dep?'selected':''}>${esc(dep)}</option>`).join('')}
        </select></div>
      <div class="modal-actions">
        <button class="btn btn--ghost" id="um-cancel">Huỷ</button>
        <button class="btn btn--primary" style="width:auto;" id="um-submit">${isEdit?'Lưu thay đổi':'Tạo tài khoản'}</button>
      </div>
    </div>
  </div>`;
}
function renderPasswordModal(){
  return `
  <div class="modal-overlay" id="pw-modal-overlay">
    <div class="modal-card">
      <h3 class="modal-title">Đổi mật khẩu</h3>
      ${state.pwError ? `<div class="error-msg">${esc(state.pwError)}</div>` : ''}
      ${state.pwOk ? `<div class="ok-msg">Đổi mật khẩu thành công.</div>` : ''}
      <div class="field"><label>Mật khẩu mới (tối thiểu 4 ký tự)</label><input id="pw-new" type="password" /></div>
      <div class="modal-actions">
        <button class="btn btn--ghost" id="pw-cancel">Đóng</button>
        <button class="btn btn--primary" style="width:auto;" id="pw-submit">Cập nhật</button>
      </div>
    </div>
  </div>`;
}
function bindModalEvents(){
  const pwOverlay = document.getElementById('pw-modal-overlay');
  if(pwOverlay){
    document.getElementById('pw-cancel').addEventListener('click', ()=>{ state.pwModalOpen=false; render(); });
    document.getElementById('pw-submit').addEventListener('click', async ()=>{
      const newPassword = document.getElementById('pw-new').value;
      try{ await api('/api/me/password', {method:'PUT', body: JSON.stringify({newPassword})}); state.pwOk=true; state.pwError=''; render(); }
      catch(e){ state.pwError = e.message; state.pwOk=false; render(); }
    });
  }
  const userOverlay = document.getElementById('user-modal-overlay');
  if(userOverlay){
    const roleSel = document.getElementById('um-role');
    const deptField = document.getElementById('um-dept-field');
    function syncDeptVisibility(){ deptField.style.display = roleSel.value==='bgd' ? 'none' : 'block'; }
    syncDeptVisibility();
    roleSel.addEventListener('change', syncDeptVisibility);
    document.getElementById('um-cancel').addEventListener('click', ()=>{ state.userModal=null; render(); });
    document.getElementById('um-submit').addEventListener('click', async ()=>{
      const isEdit = state.userModal.mode==='edit';
      const username = document.getElementById('um-username').value.trim().toLowerCase();
      const password = document.getElementById('um-password').value;
      const fullname = document.getElementById('um-fullname').value.trim();
      const role = document.getElementById('um-role').value;
      const department = role==='bgd' ? '' : document.getElementById('um-department').value;
      if(!isEdit && (!username || !password || !fullname)){ state.userModalError='Vui lòng nhập đầy đủ thông tin bắt buộc.'; render(); return; }
      try{
        if(isEdit){
          await api('/api/users/'+encodeURIComponent(username), {method:'PUT', body: JSON.stringify({password: password||undefined, fullname, role, department})});
        } else {
          await api('/api/users', {method:'POST', body: JSON.stringify({username, password, fullname, role, department})});
        }
        state.userModal=null; await loadUsers(); render();
      }catch(e){ state.userModalError = e.message; render(); }
    });
  }
}

/* ============ Khởi động ============ */
(async function init(){
  if(state.token && state.user){ await bootAfterLogin(); } else { render(); }
})();
</script>
</body>
</html>
