<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ Nhật Ký Công Việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEAE2; --paper-dark:#E1DCCE; --card:#FBFAF6;
    --ink:#232C29; --ink-soft:#63695F; --line:#C9C2AC;
    --accent:#3D6B54; --accent-soft:#DCE7DD;
    --gold:#AD7F35; --gold-soft:#F1E4C4;
    --danger:#9C3D34; --danger-soft:#F1DEDA;
    --brand-red:#8E1C28; --brand-red-dark:#6B121C; --brand-gold:#C9A227; --chart-blue:#3F6D9E;
    --radius:4px;
    --shadow-sm:0 1px 2px rgba(35,44,41,0.07), 0 1px 1px rgba(35,44,41,0.04);
    --shadow-md:0 4px 14px rgba(35,44,41,0.10), 0 1px 3px rgba(35,44,41,0.06);
    --shadow-lg:0 12px 32px rgba(35,44,41,0.16), 0 2px 6px rgba(35,44,41,0.08);
    --font-display:'Source Serif 4', Georgia, serif;
    --font-body:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}
  #app{min-height:100vh;}
  .hidden{display:none !important;}
  button, .tab, .cal-day, .day-item{transition:background-color .14s ease, box-shadow .14s ease, color .14s ease, transform .06s ease;}
  button:focus-visible, input:focus-visible, select:focus-visible, .tab:focus-visible, .cal-day:focus-visible{
    outline:2px solid var(--brand-red); outline-offset:2px; border-radius:2px;
  }
  @media (prefers-reduced-motion: reduce){ button,.tab,.cal-day,.day-item{transition:none;} }

  /* Login */
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(35,44,41,0.035) 40px), var(--paper);}
  .login-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:0;overflow:hidden;}
  .login-banner{width:100%;display:block;}
  .login-red-bar{background:linear-gradient(135deg,var(--brand-red),var(--brand-red-dark));border-bottom:2px solid var(--brand-gold);padding:16px 32px;}
  .login-red-bar span{color:#fff;font-family:var(--font-display);font-size:23px;font-weight:600;letter-spacing:.01em;}
  .login-card-body{padding:24px 32px 32px;}
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 6px;}
  .title-lg{font-family:var(--font-display);font-size:26px;font-weight:600;margin:0 0 4px;}
  .sub{font-size:13px;color:var(--ink-soft);margin:0 0 22px;line-height:1.5;}
  .login-card-body input:focus{outline:2px solid var(--brand-red);outline-offset:1px;border-color:var(--brand-red);}
  .login-card-body .btn--primary{background:var(--brand-red);}
  .login-card-body .btn--primary:hover{background:var(--brand-red-dark);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .field select,.field input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;font-family:var(--font-body);font-size:14px;color:var(--ink);}
  .field select:focus,.field input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .btn{cursor:pointer;font-family:var(--font-body);font-size:14px;font-weight:500;border-radius:var(--radius);border:1px solid transparent;padding:10px 16px;}
  .btn--primary{background:var(--accent);color:#fff;width:100%;box-shadow:var(--shadow-sm);}
  .btn--primary:hover{background:#335a45;box-shadow:var(--shadow-md);}
  .btn--primary:active{transform:translateY(1px);box-shadow:none;}
  .btn--ghost{background:#fff;border-color:var(--line);color:var(--ink);}
  .btn--ghost:hover{background:var(--paper-dark);border-color:var(--ink-soft);}
  .btn--danger{background:transparent;border-color:var(--danger);color:var(--danger);}
  .btn--danger:hover{background:var(--danger-soft);}
  .btn--sm{padding:6px 12px;font-size:13px;}
  .login-hint{margin-top:18px;padding:12px 13px;background:var(--paper-dark);border-radius:var(--radius);font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);line-height:1.6;}
  .login-hint b{color:var(--ink);}
  .error-msg{background:var(--danger-soft);color:var(--danger);border-radius:var(--radius);padding:9px 12px;font-size:13px;margin-bottom:14px;}
  .ok-msg{background:var(--accent-soft);color:var(--accent);border-radius:var(--radius);padding:9px 12px;font-size:13px;margin-bottom:14px;}

  /* Shell */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--card);box-shadow:var(--shadow-sm);position:relative;z-index:2;}
  .brand{display:flex;align-items:center;gap:14px;}
  .stamp{width:48px;height:48px;flex-shrink:0;}
  .stamp img{width:100%;height:100%;object-fit:contain;display:block;}
  .brand-title{font-family:var(--font-display);font-size:19px;font-weight:600;margin:0;letter-spacing:-.005em;}
  .brand-sub{font-size:12px;color:var(--ink-soft);margin:2px 0 0;}
  .user-area{display:flex;align-items:center;gap:10px;}
  .user-chip{text-align:right;}
  .user-name{font-size:14px;font-weight:600;}
  .user-title{font-size:12px;color:var(--ink-soft);}
  .role-tag{display:inline-block;font-family:var(--font-body);font-size:11.5px;font-weight:600;letter-spacing:.01em;padding:3px 9px;border-radius:3px;margin-top:4px;}
  .role-tag--nhan_vien{background:var(--accent-soft);color:var(--accent);}
  .role-tag--truong_phong{background:var(--gold-soft);color:var(--gold);}
  .role-tag--pho_phong{background:#DCE6ED;color:#395C73;}
  .role-tag--bgd{background:#233c2c;color:#F1E4C4;}
  .role-tag--admin{background:var(--brand-red);color:#fff;}
  .tabs{display:flex;gap:2px;padding:0 24px;border-bottom:2px solid var(--brand-gold);background:linear-gradient(135deg,var(--brand-red),var(--brand-red-dark));overflow-x:auto;box-shadow:var(--shadow-sm);position:relative;z-index:1;}
  .tab{padding:13px 18px;font-size:13.5px;color:rgba(255,255,255,0.7);cursor:pointer;border-bottom:2px solid transparent;font-weight:500;white-space:nowrap;margin-bottom:-2px;}
  .tab.active{color:#fff;border-bottom-color:var(--brand-gold);font-weight:600;background:rgba(255,255,255,0.06);}
  .tab:hover:not(.active){color:#fff;background:rgba(255,255,255,0.05);}
  .tabs-spacer{flex:1;}
  .btn-export{align-self:center;margin:8px 0;padding:7px 14px;font-size:12.5px;font-weight:500;border-radius:var(--radius);
    background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.4);cursor:pointer;white-space:nowrap;font-family:var(--font-body);}
  .btn-export:hover{background:rgba(255,255,255,0.22);}
  .main{padding:28px 28px 60px;max-width:1080px;margin:0 auto;}
  .main--wide{max-width:1620px;}

  /* My log */
  .my-log-layout{display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start;}
  .day-list{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--card);}
  .day-item{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);color:var(--ink-soft);}
  .day-item:last-child{border-bottom:none;}
  .day-item:hover{background:var(--paper-dark);}
  .day-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .day-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-left:8px;}
  .cal-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-title{font-family:var(--font-display);font-weight:600;font-size:14.5px;color:var(--ink);}
  .cal-nav{display:flex;gap:4px;}
  .cal-nav button{width:24px;height:24px;border:1px solid var(--line);background:#fff;border-radius:var(--radius);cursor:pointer;color:var(--ink-soft);font-size:12px;line-height:1;}
  .cal-nav button:hover{background:var(--paper-dark);}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;}
  .cal-weekdays span{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-soft);text-align:center;text-transform:uppercase;display:block;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-day{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12.5px;border-radius:50%;cursor:pointer;color:var(--ink);}
  .cal-day.other-month{color:var(--line);cursor:default;}
  .cal-day.future{color:var(--ink);cursor:not-allowed;}
  .cal-day.future:hover{background:none;}
  .cal-day:not(.other-month):not(.future):hover{background:var(--paper-dark);}
  .cal-day.selected{background:var(--brand-red);color:#fff;font-weight:600;}
  .cal-day.today-marker{box-shadow:inset 0 0 0 1px var(--brand-gold);}
  .cal-day .has-dot{position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--brand-gold);}
  .cal-day.selected .has-dot{background:#fff;}
  .cal-today-btn{margin-top:10px;width:100%;padding:7px;font-size:12px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;cursor:pointer;color:var(--brand-red);font-weight:500;font-family:var(--font-body);}
  .cal-today-btn:hover{background:var(--paper-dark);}
  .backup-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-top:24px;box-shadow:var(--shadow-sm);}
  .backup-card h3{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--brand-red);margin:0 0 6px;}
  .backup-card p{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;line-height:1.6;}
  .backup-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
  .backup-row input[type=file]{font-size:12.5px;}
  .backup-status{font-size:12.5px;color:var(--accent);font-weight:500;}
  .backup-status.error{color:var(--danger);}
  .backup-warning{background:var(--gold-soft);color:var(--gold);border-radius:var(--radius);padding:9px 12px;font-size:12px;margin-bottom:14px;line-height:1.5;}
  .chart-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow-sm);}
  .chart-legend{display:flex;gap:20px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);}
  .chart-legend .legend-item{display:inline-flex;align-items:center;gap:7px;}
  .chart-legend .legend-dot{width:11px;height:11px;border-radius:2px;display:inline-block;}
  .chart-legend .legend-dot.work{background:var(--chart-blue);}
  .chart-legend .legend-dot.ot{background:var(--brand-red);}
  .chart-dept-header{font-family:var(--font-display);font-weight:700;color:var(--brand-red);font-size:14px;margin:22px 0 12px;padding-bottom:5px;border-bottom:1px solid var(--line);}
  .chart-dept-header:first-child{margin-top:0;}
  .chart-row{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center;padding:9px 0;}
  .chart-row + .chart-row{border-top:1px solid var(--paper-dark);}
  .chart-name{font-size:13px;font-weight:600;color:var(--ink);}
  .chart-role-sub{font-size:11px;color:var(--ink-soft);font-weight:400;display:block;margin-top:1px;}
  .chart-bars{display:flex;flex-direction:column;gap:5px;}
  .chart-bar-line{display:flex;align-items:center;gap:10px;}
  .chart-bar-track{flex:1;background:var(--paper-dark);border-radius:2px;height:15px;position:relative;overflow:hidden;}
  .chart-bar-fill{height:100%;border-radius:2px;min-width:2px;transition:width .3s ease;}
  .chart-bar-fill.work{background:var(--chart-blue);}
  .chart-bar-fill.ot{background:var(--brand-red);}
  .chart-bar-value{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);white-space:nowrap;min-width:64px;}

  /* Đánh giá hàng tháng */
  .eval-subtabs{display:flex;gap:8px;margin-bottom:18px;}
  .eval-subtab{padding:7px 14px;font-size:13px;font-weight:500;border-radius:var(--radius);border:1px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;}
  .eval-subtab.active{background:var(--brand-red);color:#fff;border-color:var(--brand-red);}
  .eval-header-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;margin-bottom:18px;box-shadow:var(--shadow-sm);}
  .eval-header-card .name{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--brand-red);}
  .eval-header-card .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .eval-badges{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .eval-badge{font-size:12px;font-family:var(--font-body);font-weight:500;padding:4px 10px;border-radius:3px;background:var(--paper-dark);color:var(--ink-soft);}
  .eval-badge.done{background:var(--accent-soft);color:var(--accent);}
  .eval-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);}
  .eval-table th{font-size:11.5px;text-transform:none;letter-spacing:0;color:var(--brand-red);font-family:var(--font-body);font-weight:700;padding:9px 8px;border-bottom:1px solid var(--line);background:var(--paper-dark);text-align:center;}
  .eval-table th.eval-th-criteria{text-align:left;padding-left:14px;}
  .eval-table td{padding:9px 8px;font-size:12.5px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle;}
  .eval-table tr:last-child td{border-bottom:none;}
  .eval-table td.eval-td-criteria{text-align:left;padding-left:14px;}
  .eval-crit-label{font-weight:600;color:var(--ink);}
  .eval-crit-desc{font-size:11px;color:var(--ink-soft);display:block;margin-top:1px;}
  .eval-crit-max{font-size:10px;color:var(--ink-soft);font-family:var(--font-mono);display:block;}
  .eval-score-input{width:56px;padding:6px;border:1px solid var(--line);border-radius:var(--radius);text-align:center;font-family:var(--font-mono);font-size:13px;}
  .eval-score-input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .eval-score-readonly{font-family:var(--font-mono);color:var(--ink);}
  .eval-score-na{font-size:11px;color:var(--ink-soft);font-style:italic;}
  .eval-score-locked{font-size:11px;color:var(--ink-soft);}
  .eval-lock-banner{background:var(--gold-soft);color:var(--gold);border-radius:var(--radius);padding:9px 12px;font-size:12.5px;margin-top:12px;}
  .eval-tasks-box{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--brand-red);border-radius:var(--radius);padding:16px 20px;margin-bottom:18px;box-shadow:var(--shadow-sm);}
  .eval-tasks-title{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--brand-red);}
  .eval-tasks-hint{font-size:11.5px;color:var(--ink-soft);margin:2px 0 10px;font-style:italic;}
  .eval-tasks-input{width:100%;min-height:110px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);font-family:var(--font-body);font-size:13.5px;line-height:1.6;resize:vertical;}
  .eval-tasks-input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .eval-tasks-readonly{font-size:13.5px;line-height:1.7;color:var(--ink);white-space:pre-wrap;}
  .eval-avg{font-weight:700;color:var(--brand-red);font-family:var(--font-mono);}
  .eval-note-input{width:100%;min-width:100px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius);font-size:12px;}
  .eval-total-row td{background:var(--paper-dark);font-weight:700;}
  .eval-save-bar{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:14px;}
  .eval-list-row-name{font-weight:600;}
  .eval-list-row-sub{font-size:11px;color:var(--ink-soft);}
  .eval-check-yes{color:#2E8B4F;font-size:19px;font-weight:700;}
  .eval-check-no{color:var(--line);font-size:14px;}
  .session-card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--brand-red);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
  .session-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .session-title{font-family:var(--font-display);font-size:17px;font-weight:700;color:var(--brand-red);}
  .session-cap{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);background:var(--paper-dark);padding:3px 8px;border-radius:2px;}
  .session-cap.over{color:var(--danger);font-weight:600;background:var(--danger-soft);}
  .entry-row{display:grid;grid-template-columns:1fr 190px 90px 34px;gap:8px;margin-bottom:8px;align-items:center;}
  .entry-row input,.entry-row select{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:13.5px;font-family:var(--font-body);background:#fff;color:var(--ink);}
  .entry-row input:focus,.entry-row select:focus,.entry-add-row input:focus,.entry-add-row select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .entry-remove{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:var(--radius);cursor:pointer;color:var(--ink-soft);font-size:16px;line-height:1;}
  .entry-remove:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger);}
  .entry-add-row{display:grid;grid-template-columns:1fr 190px 90px 80px;gap:8px;margin-top:10px;}
  .entry-add-row input,.entry-add-row select{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:13.5px;background:#fff;color:var(--ink);}
  .empty-entries{font-size:12.5px;color:var(--ink-soft);font-style:italic;margin-bottom:8px;}
  .save-bar{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:6px;}
  .save-flash{font-size:12.5px;color:var(--accent);font-weight:500;}

  /* Report / users */
  .filters-bar{display:flex;gap:14px;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;}
  .filters-bar .field{margin-bottom:0;min-width:170px;}
  .data-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);}
  .data-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-family:var(--font-mono);font-weight:500;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--paper-dark);}
  .data-table td{padding:13px 14px;font-size:13.5px;border-bottom:1px solid var(--line);vertical-align:top;}
  .data-table tbody tr:hover td{background:rgba(142,28,40,0.028);}
  .data-table tr:last-child td{border-bottom:none;}
  .emp-name{font-weight:600;}
  .emp-dept{font-size:11.5px;color:var(--ink-soft);}
  .cell-empty{color:var(--ink-soft);font-style:italic;}
  .pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:2px;background:var(--paper-dark);margin:1px 3px 1px 0;}
  .toolbar-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .section-title{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--brand-red);margin:0;}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(35,44,41,0.5);backdrop-filter:blur(1px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;}
  .modal-card{width:100%;max-width:420px;background:var(--card);border-radius:var(--radius);padding:26px;border:1px solid var(--line);box-shadow:var(--shadow-lg);}
  .modal-title{font-family:var(--font-display);font-size:19px;font-weight:600;margin:0 0 16px;color:var(--brand-red);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  @media(max-width:720px){
    .my-log-layout{grid-template-columns:1fr;}
    .day-list{display:flex;overflow-x:auto;}
    .day-item{border-bottom:none;border-right:1px solid var(--line);white-space:nowrap;}

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div id="app"></div>

<script>
/* ============ Cấu hình & helper ============ */
const SESSION_KEYS = ['morning','afternoon','overtime'];
const SESSION_LABEL = {morning:'Buổi sáng', afternoon:'Buổi chiều', overtime:'Ngoài giờ'};
const SESSION_CAP = {morning:240, afternoon:240, overtime:720};
const ROLE_LABEL = {nhan_vien:'Nhân viên', truong_phong:'Trưởng phòng', pho_phong:'Phó phòng', bgd:'Ban giám đốc', admin:'Quản trị'};
const STATUS_OPTIONS = [
  {value:'hoan_thanh_dung_han', label:'Hoàn thành đúng hạn'},
  {value:'hoan_thanh_sau_han', label:'Hoàn thành sau hạn'},
  {value:'dang_thuc_hien_dung_han', label:'Đang thực hiện đúng hạn'},
  {value:'dang_thuc_hien_qua_han', label:'Đang thực hiện quá hạn'},
  {value:'thuong_xuyen', label:'Công việc thường xuyên'}
];
const STATUS_LABEL = Object.fromEntries(STATUS_OPTIONS.map(o=>[o.value,o.label]));

function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function shiftDate(base,delta){ const d=new Date(base); d.setDate(d.getDate()+delta); return d; }
function displayDate(iso){ const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtHM(min){ const h=Math.floor(min/60), m=min%60; return h>0 ? `${h}h${m>0?m+'p':''}` : `${m}p`; }

async function api(path, options={}){
  const headers = Object.assign({'Content-Type':'application/json'}, options.headers||{});
  if(state.token) headers['Authorization'] = 'Bearer '+state.token;
  const res = await fetch(path, Object.assign({}, options, {headers}));
  let data=null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((data && data.error) || 'Đã xảy ra lỗi, vui lòng thử lại.');
  return data;
}

/* ============ Trạng thái ============ */
const state = {
  token: localStorage.getItem('nkcv_token') || null,
  user: JSON.parse(localStorage.getItem('nkcv_user') || 'null'),
  loginError:'', loginBusy:false,
  tab:'my-log',
  myDate: todayISO(),
  myEntries: {morning:[], afternoon:[], overtime:[]},
  myFlash:'', myLoading:false,
  calYear: new Date().getFullYear(), calMonth: new Date().getMonth()+1, monthHasData: new Set(),
  reportFrom: todayISO(), reportTo: todayISO(), reportDept:'all', reportRows:[], departments:[], reportLoading:false, reportExpanded: new Set(),
  evalYear: new Date().getFullYear(), evalMonth: new Date().getMonth()+1, evalSubTab:'self',
  evalListRows: [], evalListDept:'all', evalListLoading:false, evalExpanded: new Set(), evalCache: {}, evalSelfLoading:false, evalFlash:{},
  users:[], userModal:null, /* null | {mode:'add'} | {mode:'edit', data:{...}} */ userModalError:'',
  pwModalOpen:false, pwError:'', pwOk:false
};

const app = document.getElementById('app');

/* ============ Render root ============ */
function render(){
  if(!state.token || !state.user){ renderLogin(); return; }
  renderShell();
}

/* ============ Login ============ */
function renderLogin(){
  app.innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <img class="login-banner" src="agribank-banner.png" alt="Agribank — Nhật ký công việc" />
        <div class="login-red-bar"><span>Đăng nhập</span></div>
        <div class="login-card-body">
          ${state.loginError ? `<div class="error-msg">${esc(state.loginError)}</div>` : ''}
          <div class="field"><label for="li-user">Tên đăng nhập</label><input id="li-user" type="text" autocomplete="username" /></div>
          <div class="field"><label for="li-pass">Mật khẩu</label><input id="li-pass" type="password" autocomplete="current-password" /></div>
          <button class="btn btn--primary" id="btn-login" ${state.loginBusy?'disabled':''}>${state.loginBusy?'Đang đăng nhập...':'Đăng nhập'}</button>
        </div>
      </div>
    </div>`;
  document.getElementById('btn-login').addEventListener('click', doLogin);
  document.getElementById('li-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

async function doLogin(){
  const username = document.getElementById('li-user').value.trim().toLowerCase();
  const password = document.getElementById('li-pass').value;
  if(!username || !password){ state.loginError='Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.'; render(); return; }
  state.loginBusy = true; render();
  try{
    const data = await api('/api/login', {method:'POST', body: JSON.stringify({username,password})});
    state.token = data.token; state.user = data.user;
    localStorage.setItem('nkcv_token', state.token);
    localStorage.setItem('nkcv_user', JSON.stringify(state.user));
    state.loginError=''; state.loginBusy=false;
    await bootAfterLogin();
  }catch(e){
    state.loginBusy=false; state.loginError = e.message; render();
  }
}

function doLogout(){
  state.token=null; state.user=null;
  localStorage.removeItem('nkcv_token'); localStorage.removeItem('nkcv_user');
  render();
}

async function bootAfterLogin(){
  if(state.user.role === 'admin'){
    state.tab = 'users';
    await loadUsers();
  } else if(state.user.role === 'bgd'){
    state.tab = 'report';
    state.reportLoading = true;
    render();
    await Promise.all([loadReport(), loadMyLog(state.myDate), loadMonthLogs(state.calYear, state.calMonth)]);
  } else {
    state.tab = 'my-log';
    await Promise.all([loadMyLog(state.myDate), loadMonthLogs(state.calYear, state.calMonth)]);
  }
  render();
}

/* ============ Shell ============ */
function renderShell(){
  const u = state.user;
  const noPersonalLog = u.role==='admin';
  const canSeeReport = u.role==='truong_phong' || u.role==='pho_phong' || u.role==='bgd';
  const canSeeDuration = u.role==='truong_phong' || u.role==='pho_phong' || u.role==='bgd' || u.role==='admin';
  const canSeeEval = u.role!=='admin';
  const canManageUsers = u.role === 'admin';

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="stamp"><img src="agribank-logo.png" alt="Agribank" /></div>
        <div><p class="brand-title">Sổ Nhật Ký Công Việc</p><p class="brand-sub">${esc(u.department || ROLE_LABEL[u.role])}</p></div>
      </div>
      <div class="user-area">
        <div class="user-chip">
          <div class="user-name">${esc(u.fullname)}</div>
          <span class="role-tag role-tag--${u.role}">${ROLE_LABEL[u.role]}</span>
        </div>
        <button class="btn btn--ghost btn--sm" id="btn-pw">Đổi mật khẩu</button>
        <button class="btn btn--ghost btn--sm" id="btn-logout">Đăng xuất</button>
      </div>
    </div>
    <div class="tabs">
      ${!noPersonalLog ? `<div class="tab ${state.tab==='my-log'?'active':''}" data-tab="my-log" role="tab" tabindex="0" aria-selected="${state.tab==='my-log'}">Nhật ký của tôi</div>` : ''}
      ${canSeeReport ? `<div class="tab ${state.tab==='report'?'active':''}" data-tab="report" role="tab" tabindex="0" aria-selected="${state.tab==='report'}">Báo cáo</div>` : ''}
      ${canSeeDuration ? `<div class="tab ${state.tab==='duration'?'active':''}" data-tab="duration" role="tab" tabindex="0" aria-selected="${state.tab==='duration'}">Thời lượng</div>` : ''}
      ${canSeeEval ? `<div class="tab ${state.tab==='evaluation'?'active':''}" data-tab="evaluation" role="tab" tabindex="0" aria-selected="${state.tab==='evaluation'}">Đánh giá</div>` : ''}
      ${canManageUsers ? `<div class="tab ${state.tab==='users'?'active':''}" data-tab="users" role="tab" tabindex="0" aria-selected="${state.tab==='users'}">Quản trị</div>` : ''}
      <div class="tabs-spacer"></div>
      ${!noPersonalLog ? `<button class="btn-export" id="btn-export-excel">⬇ Xuất dữ liệu (Excel)</button>` : ''}
    </div>
    <div class="main ${state.tab==='my-log'?'main--wide':''}" id="main"></div>
    ${state.pwModalOpen ? renderPasswordModal() : ''}
    ${state.userModal ? renderUserModal() : ''}
  `;
  document.getElementById('btn-logout').addEventListener('click', doLogout);
  document.getElementById('btn-pw').addEventListener('click', ()=>{ state.pwModalOpen=true; state.pwError=''; state.pwOk=false; render(); });
  const exportBtn = document.getElementById('btn-export-excel');
  if(exportBtn) exportBtn.addEventListener('click', exportMyDataExcel);
  document.querySelectorAll('.tab').forEach(el=>{
    const activateTab = async ()=>{
      state.tab = el.dataset.tab;
      if(state.tab==='my-log'){ await Promise.all([loadMyLog(state.myDate), loadMonthLogs(state.calYear, state.calMonth)]); }
      else if(state.tab==='report' || state.tab==='duration'){ state.reportLoading=true; render(); await loadReport(); }
      else if(state.tab==='users'){ await loadUsers(); }
      else if(state.tab==='evaluation'){ render(); await bootEvalTab(); }
      render();
    };
    el.addEventListener('click', activateTab);
    el.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); activateTab(); } });
  });

  if(state.tab==='my-log') renderMyLog();
  else if(state.tab==='report') renderReport();
  else if(state.tab==='duration') renderReportChart();
  else if(state.tab==='evaluation') renderEvaluation();
  else if(state.tab==='users') renderUsers();

  bindModalEvents();
}

/* ============ Tab: Nhật ký của tôi ============ */
async function loadMyLog(date){
  state.myLoading = true;
  try{
    const data = await api('/api/logs/'+date);
    state.myEntries = { morning: data.morning||[], afternoon: data.afternoon||[], overtime: data.overtime||[] };
  }catch(e){ state.myEntries = {morning:[],afternoon:[],overtime:[]}; }
  state.myLoading = false;
}

async function loadMonthLogs(year, month){
  try{
    const data = await api(`/api/logs-month?year=${year}&month=${month}`);
    const set = new Set();
    (data.logs||[]).forEach(l=>{ if((l.morning.length+l.afternoon.length+l.overtime.length)>0) set.add(l.date); });
    state.monthHasData = set;
  }catch(e){ state.monthHasData = new Set(); }
}
const MONTH_NAMES = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
function buildCalendarCells(year, month){
  const firstWeekday = new Date(year, month-1, 1).getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  const daysInPrevMonth = new Date(year, month-1, 0).getDate();
  const cells = [];
  for(let i=firstWeekday-1;i>=0;i--) cells.push({day: daysInPrevMonth-i, other:true});
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({day:d, other:false, iso});
  }
  const trailing = (7 - (cells.length % 7)) % 7;
  for(let d=1; d<=trailing; d++) cells.push({day:d, other:true});
  return cells;
}
function renderCalendar(){
  const cells = buildCalendarCells(state.calYear, state.calMonth);
  const todayIso = todayISO();
  return `
    <div class="cal-card">
      <div class="cal-head">
        <span class="cal-title">${MONTH_NAMES[state.calMonth-1]} ${state.calYear}</span>
        <div class="cal-nav">
          <button data-cal-nav="-1" title="Tháng trước">‹</button>
          <button data-cal-nav="1" title="Tháng sau">›</button>
        </div>
      </div>
      <div class="cal-weekdays"><span>CN</span><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span></div>
      <div class="cal-grid">
        ${cells.map(c=>{
          if(c.other) return `<div class="cal-day other-month">${c.day}</div>`;
          const isFuture = c.iso > todayIso;
          const isSelected = c.iso === state.myDate;
          const isToday = c.iso === todayIso;
          const hasDot = state.monthHasData.has(c.iso);
          const cls = ['cal-day'];
          if(isFuture) cls.push('future');
          if(isSelected) cls.push('selected');
          if(isToday) cls.push('today-marker');
          return `<div class="${cls.join(' ')}" ${isFuture?'':`data-date="${c.iso}" role="button" tabindex="0" aria-label="${c.iso}"`}>${c.day}${hasDot && !isSelected ? '<span class="has-dot"></span>':''}</div>`;
        }).join('')}
      </div>
      <button class="cal-today-btn" id="cal-today-btn">Về hôm nay</button>
    </div>`;
}
function bindCalendarEvents(){
  document.querySelectorAll('.cal-day[data-date]').forEach(el=>{
    const pickDay = async ()=>{ state.myDate = el.dataset.date; state.myFlash=''; await loadMyLog(state.myDate); render(); };
    el.addEventListener('click', pickDay);
    el.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); pickDay(); } });
  });
  document.querySelectorAll('[data-cal-nav]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const delta = Number(btn.dataset.calNav);
      let m = state.calMonth + delta, y = state.calYear;
      if(m<1){ m=12; y--; } if(m>12){ m=1; y++; }
      state.calMonth=m; state.calYear=y;
      await loadMonthLogs(y,m);
      render();
    });
  });
  const todayBtn = document.getElementById('cal-today-btn');
  if(todayBtn) todayBtn.addEventListener('click', async ()=>{
    const t = new Date();
    state.calYear = t.getFullYear(); state.calMonth = t.getMonth()+1;
    state.myDate = todayISO(); state.myFlash='';
    await Promise.all([loadMyLog(state.myDate), loadMonthLogs(state.calYear, state.calMonth)]);
    render();
  });
}

function renderMyLog(){
  const main = document.getElementById('main');
  const today = todayISO();

  main.innerHTML = `
    <div class="my-log-layout">
      ${renderCalendar()}
      <div>
        <div style="margin-bottom:14px;display:flex;align-items:center;gap:10px;">
          <span style="font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--brand-red);">${state.myDate===today?'Hôm nay':displayDate(state.myDate)}</span>
        </div>
        ${SESSION_KEYS.map(sk=>renderSessionCard(sk)).join('')}
        <div class="save-bar">
          <span class="save-flash">${state.myFlash}</span>
          <button class="btn btn--primary" style="width:auto;" id="btn-save-log">Lưu nhật ký</button>
        </div>
      </div>
    </div>`;

  bindCalendarEvents();
  document.getElementById('btn-save-log').addEventListener('click', saveMyLog);
  bindSessionEvents();
}

function renderSessionCard(sk){
  const entries = state.myEntries[sk] || [];
  const total = entries.reduce((s,e)=>s+(Number(e.minutes)||0),0);
  const cap = SESSION_CAP[sk];
  return `
    <div class="session-card" data-session="${sk}">
      <div class="session-head">
        <span class="session-title">${SESSION_LABEL[sk]}</span>
        <span class="session-cap ${total>cap?'over':''}">${fmtHM(total)} / tối đa ${fmtHM(cap)}</span>
      </div>
      ${entries.length===0 ? `<div class="empty-entries">Chưa có mục nào.</div>` : entries.map((e,i)=>`
        <div class="entry-row" data-idx="${i}">
          <input type="text" class="entry-desc" value="${esc(e.desc||'')}" placeholder="Mô tả công việc" />
          <select class="entry-status">
            ${STATUS_OPTIONS.map(o=>`<option value="${o.value}" ${e.status===o.value?'selected':''}>${o.label}</option>`).join('')}
          </select>
          <input type="number" min="0" class="entry-min" value="${Number(e.minutes)||0}" placeholder="Phút" />
          <button class="entry-remove" data-remove="${i}" title="Xoá mục">×</button>
        </div>`).join('')}
      <div class="entry-add-row">
        <input type="text" class="new-desc" placeholder="Mô tả công việc mới" />
        <select class="new-status">
          ${STATUS_OPTIONS.map(o=>`<option value="${o.value}">${o.label}</option>`).join('')}
        </select>
        <input type="number" min="0" class="new-min" placeholder="Phút" />
        <button class="btn btn--ghost btn--sm" data-add="1">+ Thêm</button>
      </div>
    </div>`;
}

function bindSessionEvents(){
  document.querySelectorAll('.session-card').forEach(card=>{
    const sk = card.dataset.session;
    card.querySelectorAll('.entry-desc').forEach((inp,i)=>inp.addEventListener('input', ()=>{ state.myEntries[sk][i].desc = inp.value; }));
    card.querySelectorAll('.entry-status').forEach((sel,i)=>sel.addEventListener('change', ()=>{ state.myEntries[sk][i].status = sel.value; }));
    card.querySelectorAll('.entry-min').forEach((inp,i)=>inp.addEventListener('input', ()=>{ state.myEntries[sk][i].minutes = Number(inp.value)||0; updateCapDisplay(card, sk); }));
    card.querySelectorAll('[data-remove]').forEach(btn=>btn.addEventListener('click', ()=>{ state.myEntries[sk].splice(Number(btn.dataset.remove),1); renderMyLog(); }));
    card.querySelector('[data-add]').addEventListener('click', ()=>{
      const desc = card.querySelector('.new-desc').value.trim();
      const status = card.querySelector('.new-status').value;
      const minutes = Number(card.querySelector('.new-min').value)||0;
      if(!desc || minutes<0) return;
      state.myEntries[sk].push({desc, status, minutes});
      renderMyLog();
    });
  });
}
function updateCapDisplay(card, sk){
  const total = state.myEntries[sk].reduce((s,e)=>s+(Number(e.minutes)||0),0);
  const cap = SESSION_CAP[sk];
  const capEl = card.querySelector('.session-cap');
  capEl.textContent = `${fmtHM(total)} / tối đa ${fmtHM(cap)}`;
  capEl.classList.toggle('over', total>cap);
}

async function exportMyDataExcel(){
  if(typeof XLSX === 'undefined'){ alert('Không tải được thư viện xuất Excel, vui lòng kiểm tra kết nối mạng và thử lại.'); return; }
  let logsData;
  try{
    const data = await api('/api/logs?limit=366');
    logsData = data.logs || [];
  }catch(e){ alert('Không thể lấy dữ liệu: ' + e.message); return; }

  const rows = [];
  logsData
    .slice()
    .sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0))
    .forEach(entry=>{
      SESSION_KEYS.forEach(sk=>{
        (entry[sk] || []).forEach(item=>{
          rows.push({
            'Ngày tháng': displayDate(entry.date),
            'Công việc khai trong Sổ nhật ký': item.desc || '',
            'Trạng thái công việc': STATUS_LABEL[item.status] || '',
            'Thời gian (phút)': Number(item.minutes) || 0
          });
        });
      });
    });

  if(rows.length === 0){ alert('Chưa có dữ liệu nhật ký để xuất.'); return; }

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:14},{wch:50},{wch:26},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Nhật ký công việc');
  const fileName = `nhat-ky-cong-viec_${state.user.username}_${todayISO()}.xlsx`;
  XLSX.writeFile(wb, fileName);
}

async function saveMyLog(){
  for(const sk of SESSION_KEYS){
    const total = state.myEntries[sk].reduce((s,e)=>s+(Number(e.minutes)||0),0);
    if(total > SESSION_CAP[sk]){ state.myFlash=''; alert(`${SESSION_LABEL[sk]} vượt quá thời lượng tối đa (${fmtHM(SESSION_CAP[sk])}).`); return; }
  }
  try{
    await api('/api/logs/'+state.myDate, {method:'PUT', body: JSON.stringify(state.myEntries)});
    state.myFlash = 'Đã lưu ✓';
    await loadMonthLogs(state.calYear, state.calMonth);
    render();
  }catch(e){ alert(e.message); }
}

/* ============ Tab: Báo cáo ============ */
async function loadReport(){
  try{
    let url = `/api/report?from=${state.reportFrom}&to=${state.reportTo}`;
    if(state.user.role==='bgd' || state.user.role==='admin') url += `&department=${encodeURIComponent(state.reportDept)}`;
    const data = await api(url);
    state.reportRows = data.rows; state.departments = data.departments;
  }catch(e){ state.reportRows=[]; }
  state.reportLoading=false;
}

function rowTotalMinutes(days){
  return (days||[]).reduce((sum,d)=> sum + SESSION_KEYS.reduce((s,sk)=> s+(d[sk]||[]).reduce((a,e)=>a+(Number(e.minutes)||0),0), 0), 0);
}

function renderReport(){
  const main = document.getElementById('main');
  const isBgd = state.user.role==='bgd';
  const groupByDept = isBgd && state.reportDept==='all';
  main.innerHTML = `
    <div class="toolbar-row">
      <h2 class="section-title">${isBgd ? 'Báo cáo — Công việc theo phòng ban' : 'Báo cáo công việc theo khoảng ngày'}</h2>
      <button class="btn btn--ghost btn--sm" id="btn-export-report">⬇ Xuất dữ liệu (Excel)</button>
    </div>
    <div class="filters-bar">
      <div class="field"><label for="rep-from">Từ ngày</label><input type="date" id="rep-from" value="${state.reportFrom}" /></div>
      <div class="field"><label for="rep-to">Đến ngày</label><input type="date" id="rep-to" value="${state.reportTo}" /></div>
      ${isBgd ? `<div class="field"><label for="rep-dept">Phòng ban</label>
        <select id="rep-dept">
          <option value="all" ${state.reportDept==='all'?'selected':''}>Tất cả phòng ban</option>
          ${state.departments.map(d=>`<option value="${esc(d)}" ${state.reportDept===d?'selected':''}>${esc(d)}</option>`).join('')}
        </select></div>` : ''}
    </div>
    <table class="data-table">
      <thead><tr><th></th><th>Nhân viên</th><th>Số ngày có ghi nhận</th><th>Tổng thời gian</th></tr></thead>
      <tbody>
        ${state.reportLoading ? `<tr><td colspan="4" style="text-align:center;color:var(--ink-soft);padding:24px;">Đang tải...</td></tr>` :
          (state.reportRows.length===0 ? `<tr><td colspan="4" style="text-align:center;color:var(--ink-soft);font-style:italic;padding:24px;">Không có dữ liệu</td></tr>` :
          (groupByDept ? renderReportRowsGrouped(state.reportRows, isBgd) : renderReportRowsFlat(state.reportRows, isBgd)))}
      </tbody>
    </table>`;
  document.getElementById('rep-from').addEventListener('change', async e=>{ state.reportFrom=e.target.value; state.reportLoading=true; render(); await loadReport(); render(); });
  document.getElementById('rep-to').addEventListener('change', async e=>{ state.reportTo=e.target.value; state.reportLoading=true; render(); await loadReport(); render(); });
  const deptSel = document.getElementById('rep-dept');
  if(deptSel) deptSel.addEventListener('change', async e=>{ state.reportDept=e.target.value; state.reportLoading=true; render(); await loadReport(); render(); });
  document.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const u = btn.dataset.toggle;
      if(state.reportExpanded.has(u)) state.reportExpanded.delete(u); else state.reportExpanded.add(u);
      render();
    });
  });
  document.getElementById('btn-export-report').addEventListener('click', exportReportExcel);
}

function deptRank(dept){ const idx = state.departments.indexOf(dept); return idx===-1 ? 999 : idx; }
function roleRank(role){ return {truong_phong:0, pho_phong:1, nhan_vien:2, bgd:3, admin:4}[role] ?? 5; }
function workOtMinutes(days){
  let work=0, ot=0;
  (days||[]).forEach(d=>{
    work += (d.morning||[]).reduce((s,e)=>s+(Number(e.minutes)||0),0);
    work += (d.afternoon||[]).reduce((s,e)=>s+(Number(e.minutes)||0),0);
    ot += (d.overtime||[]).reduce((s,e)=>s+(Number(e.minutes)||0),0);
  });
  return {work, ot};
}

function renderChartBody(){
  const canPickDept = state.user.role==='bgd' || state.user.role==='admin';
  const rows = (state.reportRows||[]).map(r=>({ ...r, ...workOtMinutes(r.days) }));
  if(rows.length===0) return `<div style="text-align:center;color:var(--ink-soft);font-style:italic;padding:24px;">Không có dữ liệu</div>`;
  const maxVal = Math.max(1, ...rows.map(r=>Math.max(r.work, r.ot)));
  const sorted = rows.slice().sort((a,b)=>{
    const dd = deptRank(a.department) - deptRank(b.department);
    if(dd!==0) return dd;
    const rr = roleRank(a.role) - roleRank(b.role);
    if(rr!==0) return rr;
    return a.fullname.localeCompare(b.fullname, 'vi');
  });

  const legend = `<div class="chart-legend">
    <span class="legend-item"><span class="legend-dot work"></span>Giờ làm việc trong ngày</span>
    <span class="legend-item"><span class="legend-dot ot"></span>Ngoài giờ</span>
  </div>`;

  const groupByDept = canPickDept && state.reportDept==='all';
  const rowHtml = r => `
    <div class="chart-row">
      <div><div class="chart-name">${esc(r.fullname)}</div><span class="chart-role-sub">${esc(ROLE_LABEL[r.role]||'')}</span></div>
      <div class="chart-bars">
        <div class="chart-bar-line">
          <div class="chart-bar-track"><div class="chart-bar-fill work" style="width:${(r.work/maxVal*100).toFixed(1)}%"></div></div>
          <span class="chart-bar-value">${r.work} phút</span>
        </div>
        <div class="chart-bar-line">
          <div class="chart-bar-track"><div class="chart-bar-fill ot" style="width:${(r.ot/maxVal*100).toFixed(1)}%"></div></div>
          <span class="chart-bar-value">${r.ot} phút</span>
        </div>
      </div>
    </div>`;

  if(!groupByDept){
    return legend + sorted.map(rowHtml).join('');
  }
  const groups = {};
  const order = [];
  sorted.forEach(r=>{
    const dept = r.department || 'Ban Giám đốc';
    if(!groups[dept]){ groups[dept]=[]; order.push(dept); }
    groups[dept].push(r);
  });
  const orderedDepts = state.departments.filter(d=>groups[d]).concat(order.filter(d=>!state.departments.includes(d)));
  return legend + orderedDepts.map(dept=>`
    <div class="chart-dept-header">${esc(dept)}</div>
    ${groups[dept].map(rowHtml).join('')}
  `).join('');
}

function renderReportRowsFlat(rows, isBgd){
  return rows.map(r=>renderReportRow(r, isBgd)).join('');
}
function renderReportRowsGrouped(rows, isBgd){
  const groups = {};
  const order = [];
  rows.forEach(r=>{
    const dept = r.department || 'Ban Giám đốc';
    if(!groups[dept]){ groups[dept]=[]; order.push(dept); }
    groups[dept].push(r);
  });
  const orderedDepts = state.departments.filter(d=>groups[d]).concat(order.filter(d=>!state.departments.includes(d)));
  return orderedDepts.map(dept=>`
    <tr><td colspan="4" style="background:var(--paper-dark);padding:9px 14px;font-family:var(--font-display);font-weight:700;color:var(--brand-red);font-size:13.5px;">${esc(dept)}</td></tr>
    ${groups[dept].map(r=>renderReportRow(r, isBgd)).join('')}
  `).join('');
}
function renderReportRow(r, isBgd){
  const total = rowTotalMinutes(r.days);
  const expanded = state.reportExpanded.has(r.username);
  const rows = [`<tr>
    <td style="width:30px;"><button class="btn btn--ghost btn--sm" data-toggle="${esc(r.username)}" style="padding:4px 8px;">${expanded?'▾':'▸'}</button></td>
    <td><div class="emp-name">${esc(r.fullname)} ${(r.role==='truong_phong'||r.role==='pho_phong')?`<span class="role-tag role-tag--${r.role}" style="margin-left:6px;">${ROLE_LABEL[r.role]}</span>`:''}</div>${isBgd?`<div class="emp-dept">${esc(r.department)}</div>`:''}</td>
    <td>${(r.days||[]).length} ngày</td>
    <td><b>${fmtHM(total)}</b></td>
  </tr>`];
  if(expanded){
    rows.push(`<tr><td></td><td colspan="3" style="padding:0 14px 16px;">
      ${(r.days||[]).length===0 ? `<span class="cell-empty">Chưa có ghi nhận nào trong khoảng ngày này.</span>` : `
      <table class="data-table" style="border-color:var(--paper-dark);">
        <thead><tr><th>Ngày</th><th>Buổi sáng</th><th>Buổi chiều</th><th>Ngoài giờ</th></tr></thead>
        <tbody>
          ${r.days.map(d=>`<tr>
            <td style="white-space:nowrap;font-family:var(--font-mono);">${displayDate(d.date)}</td>
            ${SESSION_KEYS.map(sk=>`<td>${renderEntryCell(d[sk])}</td>`).join('')}
          </tr>`).join('')}
        </tbody>
      </table>`}
    </td></tr>`);
  }
  return rows.join('');
}

function exportReportExcel(){
  if(typeof XLSX === 'undefined'){ alert('Không tải được thư viện xuất Excel, vui lòng kiểm tra kết nối mạng và thử lại.'); return; }
  const rows = [];
  (state.reportRows||[]).forEach(r=>{
    (r.days||[]).forEach(d=>{
      SESSION_KEYS.forEach(sk=>{
        (d[sk]||[]).forEach(item=>{
          rows.push({
            'Họ tên': r.fullname,
            'Phòng ban': r.department || '',
            'Ngày tháng': displayDate(d.date),
            'Ca': SESSION_LABEL[sk],
            'Công việc khai trong Sổ nhật ký': item.desc || '',
            'Trạng thái công việc': STATUS_LABEL[item.status] || '',
            'Thời gian (phút)': Number(item.minutes) || 0
          });
        });
      });
    });
  });

  if(rows.length === 0){ alert('Không có dữ liệu trong khoảng ngày/phòng ban đang chọn để xuất.'); return; }

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:22},{wch:26},{wch:14},{wch:12},{wch:50},{wch:26},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Báo cáo công việc');
  const canPickDept = state.user.role==='bgd' || state.user.role==='admin';
  const deptTag = canPickDept ? (state.reportDept==='all' ? 'tat-ca-phong-ban' : state.reportDept.replace(/\s+/g,'-')) : state.user.department.replace(/\s+/g,'-');
  const fileName = `bao-cao-cong-viec_${deptTag}_${state.reportFrom}_${state.reportTo}.xlsx`;
  XLSX.writeFile(wb, fileName);
}
function renderEntryCell(entries){
  if(!entries || entries.length===0) return `<span class="cell-empty">Chưa ghi nhận</span>`;
  return entries.map(e=>`<span class="pill">${esc(e.desc||'(không có mô tả)')} · ${esc(STATUS_LABEL[e.status]||'—')} · ${fmtHM(Number(e.minutes)||0)}</span>`).join(' ');
}

/* ============ Tab: Đánh giá hàng tháng ============ */
async function bootEvalTab(){
  state.evalCache = {};
  if(state.user.role==='truong_phong'){
    if(state.evalSubTab==='team') await loadEvalList();
    else await loadEvalDetail(state.user.username);
  } else if(state.user.role==='bgd'){
    await loadEvalList();
  } else {
    await loadEvalDetail(state.user.username);
  }
}

async function loadEvalList(){
  state.evalListLoading = true;
  try{
    let url = `/api/evaluations?year=${state.evalYear}&month=${state.evalMonth}`;
    if(state.user.role==='bgd') url += `&department=${encodeURIComponent(state.evalListDept)}`;
    const data = await api(url);
    state.evalListRows = data.rows; state.departments = data.departments;
  }catch(e){ state.evalListRows = []; }
  state.evalListLoading = false;
}

async function loadEvalDetail(username){
  try{
    const data = await api(`/api/evaluations/${encodeURIComponent(username)}/${state.evalYear}/${state.evalMonth}`);
    state.evalCache[username] = data;
  }catch(e){ state.evalCache[username] = { __error: e.message || 'Không thể tải phiếu đánh giá.' }; }
}


function renderEvaluation(){
  const main = document.getElementById('main');
  const role = state.user.role;
  let bodyHtml = '';
  if(role==='truong_phong'){
    bodyHtml = `
      <div class="eval-subtabs">
        <button class="eval-subtab ${state.evalSubTab==='self'?'active':''}" data-subtab="self">Đánh giá của tôi</button>
        <button class="eval-subtab ${state.evalSubTab==='team'?'active':''}" data-subtab="team">Chấm điểm nhân viên phòng ban</button>
      </div>
      ${state.evalSubTab==='self' ? renderEvalFormHtml(state.user.username) : renderEvalListHtml()}`;
  } else if(role==='bgd'){
    bodyHtml = renderEvalListHtml();
  } else {
    bodyHtml = renderEvalFormHtml(state.user.username);
  }
  main.innerHTML = `
    <div class="toolbar-row">
      <h2 class="section-title">Đánh giá mức độ hoàn thành công việc</h2>
      ${role==='bgd' ? `<button class="btn btn--ghost btn--sm" id="btn-export-eval">⬇ Xuất dữ liệu (Excel)</button>` : ''}
    </div>
    ${renderEvalMonthPicker()}
    <div id="eval-body">${bodyHtml}</div>`;

  const exportBtn = document.getElementById('btn-export-eval');
  if(exportBtn) exportBtn.addEventListener('click', exportEvalExcel);
  bindEvalTopControls();
  bindEvalListEvents();
  document.querySelectorAll('.eval-form-wrap').forEach(el=>bindEvalFormEvents(el.dataset.evalFormUser));
}

function renderEvalMonthPicker(){
  const months = Array.from({length:12}, (_,i)=>i+1);
  const years = [state.evalYear-1, state.evalYear, state.evalYear+1];
  return `
    <div class="filters-bar">
      <div class="field"><label for="eval-month">Tháng</label>
        <select id="eval-month">${months.map(m=>`<option value="${m}" ${m===state.evalMonth?'selected':''}>Tháng ${m}</option>`).join('')}</select>
      </div>
      <div class="field"><label for="eval-year">Năm</label>
        <select id="eval-year">${years.map(y=>`<option value="${y}" ${y===state.evalYear?'selected':''}>${y}</option>`).join('')}</select>
      </div>
      ${state.user.role==='bgd' ? `<div class="field"><label for="eval-dept">Phòng ban</label>
        <select id="eval-dept">
          <option value="all" ${state.evalListDept==='all'?'selected':''}>Tất cả phòng ban</option>
          ${state.departments.map(d=>`<option value="${esc(d)}" ${state.evalListDept===d?'selected':''}>${esc(d)}</option>`).join('')}
        </select></div>` : ''}
    </div>`;
}

function bindEvalTopControls(){
  const monthSel = document.getElementById('eval-month');
  const yearSel = document.getElementById('eval-year');
  const deptSel = document.getElementById('eval-dept');
  const refresh = async ()=>{ await bootEvalTab(); renderEvaluation(); };
  if(monthSel) monthSel.addEventListener('change', async e=>{ state.evalMonth=Number(e.target.value); state.evalExpanded=new Set(); await refresh(); });
  if(yearSel) yearSel.addEventListener('change', async e=>{ state.evalYear=Number(e.target.value); state.evalExpanded=new Set(); await refresh(); });
  if(deptSel) deptSel.addEventListener('change', async e=>{ state.evalListDept=e.target.value; state.evalExpanded=new Set(); await refresh(); });
  document.querySelectorAll('.eval-subtab').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      state.evalSubTab = btn.dataset.subtab;
      state.evalExpanded = new Set();
      if(state.evalSubTab==='team') await loadEvalList();
      else await loadEvalDetail(state.user.username);
      renderEvaluation();
    });
  });
}

function bindEvalListEvents(){
  document.querySelectorAll('[data-eval-toggle]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const u = btn.dataset.evalToggle;
      if(state.evalExpanded.has(u)){ state.evalExpanded.delete(u); }
      else { state.evalExpanded.add(u); if(!state.evalCache[u]) await loadEvalDetail(u); }
      renderEvaluation();
    });
  });
}

function renderEvalListHtml(){
  if(state.evalListLoading) return `<div style="text-align:center;color:var(--ink-soft);padding:24px;">Đang tải...</div>`;
  if(state.evalListRows.length===0) return `<div style="text-align:center;color:var(--ink-soft);font-style:italic;padding:24px;">Không có dữ liệu</div>`;
  const isBgd = state.user.role==='bgd';
  const groupByDept = isBgd && state.evalListDept==='all';
  const statusIcon = done => done ? '<span class="eval-check-yes">✓</span>' : '<span class="eval-check-no">—</span>';

  const rowHtml = r => {
    const expanded = state.evalExpanded.has(r.username);
    const isMgr = r.role==='truong_phong' || r.role==='pho_phong';
    let out = `<tr>
      <td style="width:30px;"><button class="btn btn--ghost btn--sm" data-eval-toggle="${esc(r.username)}" style="padding:4px 8px;">${expanded?'▾':'▸'}</button></td>
      <td><div class="eval-list-row-name">${esc(r.fullname)}</div><div class="eval-list-row-sub">${esc(ROLE_LABEL[r.role]||'')}${isBgd?' · '+esc(r.department):''}</div></td>
      <td>${statusIcon(r.submitted.nld)}</td>
      <td>${isMgr?'—':statusIcon(r.submitted.ld_phong)}</td>
      <td>${statusIcon(r.submitted.pho_truong)}</td>
      <td>${statusIcon(r.submitted.truong_don_vi)}</td>
      <td><b>${r.avgScore===null?'—':r.avgScore}</b></td>
    </tr>`;
    if(expanded){
      out += `<tr><td></td><td colspan="6" style="padding:0 14px 18px;">${renderEvalFormHtml(r.username)}</td></tr>`;
    }
    return out;
  };

  const header = `<thead><tr><th></th><th>Nhân viên</th><th>NLĐ</th><th>LĐ phòng</th><th>Phó trưởng ĐV</th><th>Trưởng ĐV</th><th>Điểm BQ</th></tr></thead>`;

  if(!groupByDept){
    return `<table class="data-table">${header}<tbody>${state.evalListRows.map(rowHtml).join('')}</tbody></table>`;
  }
  const groups = {}; const order=[];
  state.evalListRows.forEach(r=>{ const d=r.department||'Ban Giám đốc'; if(!groups[d]){groups[d]=[];order.push(d);} groups[d].push(r); });
  const orderedDepts = state.departments.filter(d=>groups[d]).concat(order.filter(d=>!state.departments.includes(d)));
  const body = orderedDepts.map(d=>`
    <tr><td colspan="7" style="background:var(--paper-dark);padding:9px 14px;font-family:var(--font-display);font-weight:700;color:var(--brand-red);font-size:13.5px;">${esc(d)}</td></tr>
    ${groups[d].map(rowHtml).join('')}
  `).join('');
  return `<table class="data-table">${header}<tbody>${body}</tbody></table>`;
}

function renderEvalFormHtml(username){
  const data = state.evalCache[username];
  if(data && data.__error) return `<div class="eval-form-wrap" data-eval-form-user="${esc(username)}"><div class="eval-header-card"><div style="text-align:center;color:var(--danger);">${esc(data.__error)}</div></div></div>`;
  if(!data) return `<div class="eval-form-wrap" data-eval-form-user="${esc(username)}"><div class="eval-header-card"><div style="text-align:center;color:var(--ink-soft);">Đang tải phiếu đánh giá...</div></div></div>`;

  const { target, criteria, scores, submitted, editableFields } = data;
  const editable = new Set(editableFields);
  const isMgr = target.role==='truong_phong' || target.role==='pho_phong';
  const ownField = ['nld','ld_phong','pho_truong','truong_don_vi'].find(f=>editable.has(f));
  const isLocked = ownField ? !!submitted[ownField] : true;
  const canStillEdit = !!ownField && !isLocked;

  const rowsHtml = criteria.map(c=>{
    const row = scores.find(s=>s.id===c.id) || {id:c.id, nld:0, ld_phong:0, pho_truong:0, truong_don_vi:0, ghi_chu:''};
    row.__max = c.max;
    const avg = row.avg;
    const cell = (field) => {
      if(field==='ld_phong' && isMgr) return `<span class="eval-score-na">Không áp dụng</span>`;
      const isOwn = editable.has(field);
      if(isOwn && !isLocked){
        return `<input type="number" min="0" max="${c.max}" class="eval-score-input" data-field="${field}" data-crit="${c.id}" value="${row[field] ?? 0}" /><span class="eval-crit-max">Tối đa ${c.max}</span>`;
      }
      const val = row[field];
      if(val === null){
        return submitted[field]
          ? `<span class="eval-check-yes">✓</span> <span class="eval-score-locked">Đã chấm</span>`
          : `<span class="eval-check-no">—</span> <span class="eval-score-locked">Chưa chấm</span>`;
      }
      return `<span class="eval-score-readonly">${val}</span><span class="eval-crit-max">Tối đa ${c.max}</span>`;
    };
    return `<tr data-row-id="${c.id}">
      <td>${c.id<=4?c.id:c.group}</td>
      <td class="eval-td-criteria">
        <span class="eval-crit-label">${esc(c.label)}</span>
        ${c.desc?`<span class="eval-crit-desc">${esc(c.desc)}</span>`:''}
      </td>
      <td>${cell('nld')}</td>
      <td>${cell('ld_phong')}</td>
      <td>${cell('pho_truong')}</td>
      <td>${cell('truong_don_vi')}</td>
      <td class="eval-avg" data-avg-for="${c.id}">${avg===null?'—':avg.toFixed(1)}</td>
      <td>${(editable.has('ghi_chu') && !isLocked) ? `<input type="text" class="eval-note-input" data-note="${c.id}" value="${esc(row.ghi_chu||'')}" />` : `<span style="font-size:11.5px;color:var(--ink-soft);">${esc(row.ghi_chu||'')}</span>`}</td>
    </tr>`;
  }).join('');

  const totals = { nld:0, ld_phong:0, pho_truong:0, truong_don_vi:0 };
  scores.forEach(r=>{
    totals.nld += Number(r.nld||0);
    if(r.ld_phong!==null) totals.ld_phong += Number(r.ld_phong||0);
    if(r.pho_truong!==null) totals.pho_truong += Number(r.pho_truong||0);
    if(r.truong_don_vi!==null) totals.truong_don_vi += Number(r.truong_don_vi||0);
  });
  const totalAvg = data.totalAvg;

  return `
    <div class="eval-form-wrap" data-eval-form-user="${esc(username)}">
      <div class="eval-header-card">

function bindEvalFormEvents(username){
  const wrap = document.querySelector(`.eval-form-wrap[data-eval-form-user="${CSS.escape(username)}"]`);
  if(!wrap) return;
  const data = state.evalCache[username];
  if(!data || !data.scores) return;
  wrap.querySelectorAll('.eval-score-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const critId = Number(inp.dataset.crit);
      const field = inp.dataset.field;
      const crit = data.criteria.find(c=>c.id===critId);
      let v = Number(inp.value);
      if(!Number.isFinite(v) || v<0) v = 0;
      if(crit && v>crit.max) v = crit.max;
      inp.value = v;
      const row = data.scores.find(s=>s.id===critId);
      if(row){ row[field] = v; }
      updateEvalTotalsDisplay(wrap, data);
    });
  });
  wrap.querySelectorAll('.eval-note-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const critId = Number(inp.dataset.note);
      const row = data.scores.find(s=>s.id===critId);
      if(row) row.ghi_chu = inp.value;
    });
  });
  const tasksInput = wrap.querySelector('[data-key-tasks]');
  if(tasksInput) tasksInput.addEventListener('input', ()=>{ data.keyTasks = tasksInput.value; });
  const saveBtn = wrap.querySelector('[data-eval-save]');
  if(saveBtn) saveBtn.addEventListener('click', ()=>saveEvalForm(username));
}

function updateEvalTotalsDisplay(wrap, data){
  const totals = { nld:0, ld_phong:0, pho_truong:0, truong_don_vi:0 };
  data.scores.forEach(r=>{
    totals.nld += Number(r.nld||0);
    if(r.ld_phong!==null) totals.ld_phong += Number(r.ld_phong||0);
    if(r.pho_truong!==null) totals.pho_truong += Number(r.pho_truong||0);
    if(r.truong_don_vi!==null) totals.truong_don_vi += Number(r.truong_don_vi||0);
  });
  const totalRow = wrap.querySelector('.eval-total-row');
  if(!totalRow) return;
  const tds = totalRow.querySelectorAll('td');
  const isMgr = data.target.role==='truong_phong' || data.target.role==='pho_phong';
  tds[1].textContent = totals.nld;
  tds[2].textContent = isMgr ? '—' : totals.ld_phong;
  tds[3].textContent = totals.pho_truong;
  tds[4].textContent = totals.truong_don_vi;
  // Điểm bình quân do server tính lại chính xác sau khi Lưu; không ước tính trên client.
}

async function exportEvalExcel(){
  if(typeof XLSX === 'undefined'){ alert('Không tải được thư viện xuất Excel, vui lòng kiểm tra kết nối mạng và thử lại.'); return; }
  try{
    let url = `/api/evaluations/export?year=${state.evalYear}&month=${state.evalMonth}`;
    if(state.user.role==='bgd') url += `&department=${encodeURIComponent(state.evalListDept)}`;
    const data = await api(url);
    const rawRows = data.rows||[];
    const rows = rawRows.map(r=>({
      'Họ tên': r.fullname,
      'Chức vụ': ROLE_LABEL[r.role] || r.role,
      'Phòng ban': r.department || '',
      'Tiêu chí đánh giá': r.isTotal ? 'Tổng điểm' : r.criterion,
      'NLĐ (Tự đánh giá)': r.nld===null?'':r.nld,
      'LĐ phòng/nghiệp vụ': r.ld_phong===null?'':r.ld_phong,
      'Phó trưởng đơn vị': r.pho_truong===null?'':r.pho_truong,
      'Trưởng đơn vị': r.truong_don_vi===null?'':r.truong_don_vi,
      'Điểm bình quân': r.avg===null?'':r.avg,
      'Ghi chú': r.ghi_chu || '',
    }));
    if(rows.length===0){ alert('Không có dữ liệu để xuất.'); return; }
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:22},{wch:16},{wch:26},{wch:36},{wch:14},{wch:16},{wch:16},{wch:14},{wch:14},{wch:30}];
    // In đậm dòng "Tổng điểm" của mỗi người (thể hiện Tổng bình quân cả tháng)
    const colCount = 10;
    rawRows.forEach((r, i)=>{
      if(!r.isTotal) return;
      const excelRow = i + 2; // +1 vì header chiếm dòng 1, +1 vì XLSX 1-indexed
      for(let c=0; c<colCount; c++){
        const addr = XLSX.utils.encode_cell({ r: excelRow-1, c });
        if(!ws[addr]) ws[addr] = { t:'s', v:'' };
        ws[addr].s = { font: { bold: true } };
      }
    });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Đánh giá công việc');
    const deptTag = state.user.role==='bgd' ? (state.evalListDept==='all' ? 'tat-ca-phong-ban' : state.evalListDept.replace(/\s+/g,'-')) : 'toan-cong-ty';
    XLSX.writeFile(wb, `danh-gia-cong-viec_${deptTag}_thang${state.evalMonth}-${state.evalYear}.xlsx`, {cellStyles:true});
  }catch(e){ alert('Lỗi: ' + e.message); }
}

async function saveEvalForm(username){
  const data = state.evalCache[username];
  if(!data) return;
  const payload = { scores: data.scores.map(r=>({ id:r.id, nld:r.nld, ld_phong:r.ld_phong, pho_truong:r.pho_truong, truong_don_vi:r.truong_don_vi, ghi_chu:r.ghi_chu })), keyTasks: data.keyTasks||'' };
  try{
    await api(`/api/evaluations/${encodeURIComponent(username)}/${state.evalYear}/${state.evalMonth}`, {method:'PUT', body: JSON.stringify(payload)});
    state.evalFlash[username] = 'Đã lưu ✓';
    await loadEvalDetail(username);
    if(state.user.role==='bgd' || (state.user.role==='truong_phong' && state.evalSubTab==='team')) await loadEvalList();
    renderEvaluation();
  }catch(e){ alert(e.message); }
}

async function exportAllDataExcel(){
  const statusEl = document.getElementById('export-status');
  if(typeof XLSX === 'undefined'){ statusEl.textContent = 'Không tải được thư viện Excel.'; statusEl.classList.add('error'); return; }
  statusEl.classList.remove('error'); statusEl.textContent = 'Đang xuất...';
  try{
    const data = await api('/api/admin/export');
    const usersRows = (data.users||[]).map(u=>({
      username: u.username, password_hash: u.password_hash, fullname: u.fullname, role: u.role, department: u.department||'', eval_title: u.eval_title||''
    }));
    const logsRows = (data.logs||[]).map(l=>({
      username: l.username, log_date: l.log_date,
      morning: JSON.stringify(l.morning||[]), afternoon: JSON.stringify(l.afternoon||[]), overtime: JSON.stringify(l.overtime||[])
    }));
    const evalRows = (data.evaluations||[]).map(ev=>({
      username: ev.username, year: ev.year, month: ev.month,
      scores: JSON.stringify(ev.scores||[]), submitted: JSON.stringify(ev.submitted||{})
    }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(usersRows), 'Users');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(logsRows), 'Logs');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(evalRows), 'Evaluations');
    XLSX.writeFile(wb, `backup_so-nhat-ky-cong-viec_${todayISO()}.xlsx`);
    statusEl.textContent = `Đã xuất ✓ (${usersRows.length} người dùng, ${logsRows.length} bản ghi nhật ký, ${evalRows.length} phiếu đánh giá)`;
  }catch(e){ statusEl.classList.add('error'); statusEl.textContent = 'Lỗi: ' + e.message; }
}

async function restoreAllDataExcel(){
  const statusEl = document.getElementById('restore-status');
  const fileInput = document.getElementById('restore-file');
  statusEl.classList.remove('error');
  if(typeof XLSX === 'undefined'){ statusEl.textContent = 'Không tải được thư viện Excel.'; statusEl.classList.add('error'); return; }
  const file = fileInput.files[0];
  if(!file){ statusEl.textContent = 'Vui lòng chọn file backup (.xlsx) trước.'; statusEl.classList.add('error'); return; }
  if(!confirm('Khôi phục sẽ GHI ĐÈ dữ liệu người dùng, nhật ký và phiếu đánh giá trùng khớp trong file lên dữ liệu hiện tại. Bạn chắc chắn muốn tiếp tục?')) return;
  statusEl.textContent = 'Đang đọc file...';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const usersSheet = wb.Sheets['Users'];
    const logsSheet = wb.Sheets['Logs'];
    const evalSheet = wb.Sheets['Evaluations'];
    if(!usersSheet || !logsSheet) throw new Error('File không đúng định dạng (thiếu sheet Users hoặc Logs).');
    const usersRows = XLSX.utils.sheet_to_json(usersSheet).map(u=>({ ...u, eval_title: u.eval_title || null }));
    const logsRowsRaw = XLSX.utils.sheet_to_json(logsSheet);
    const logsRows = logsRowsRaw.map(r=>({
      username: r.username, log_date: r.log_date,
      morning: JSON.parse(r.morning||'[]'), afternoon: JSON.parse(r.afternoon||'[]'), overtime: JSON.parse(r.overtime||'[]')
    }));
    const evalRows = evalSheet ? XLSX.utils.sheet_to_json(evalSheet).map(r=>({
      username: r.username, year: r.year, month: r.month,
      scores: JSON.parse(r.scores||'[]'), submitted: JSON.parse(r.submitted||'{}')
    })) : [];
    statusEl.textContent = 'Đang khôi phục...';
    const res = await api('/api/admin/import', {method:'POST', body: JSON.stringify({users: usersRows, logs: logsRows, evaluations: evalRows})});
    statusEl.textContent = `Khôi phục thành công ✓ (${res.usersImported} người dùng, ${res.logsImported} bản ghi nhật ký, ${res.evalsImported||0} phiếu đánh giá)`;
    fileInput.value = '';
    await loadUsers(); render();
  }catch(e){ statusEl.classList.add('error'); statusEl.textContent = 'Lỗi: ' + e.message; }
}

      try{
        if(isEdit){
          await api('/api/users/'+encodeURIComponent(username), {method:'PUT', body: JSON.stringify({password: password||undefined, fullname, role, department, eval_title})});
        } else {
          await api('/api/users', {method:'POST', body: JSON.stringify({username, password, fullname, role, department, eval_title})});
        }
        state.userModal=null; await loadUsers(); render();
      }catch(e){ state.userModalError = e.message; render(); }
    });
  }
}

/* ============ Khởi động ============ */
(async function init(){
  if(state.token && state.user){ await bootAfterLogin(); } else { render(); }
})();
</script>
</body>
</html>
