databases:
  - name: so-nhat-ky-db
    plan: free
    databaseName: sonhatky
    user: sonhatky

services:
  - type: web
    name: so-nhat-ky-cong-viec
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: so-nhat-ky-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
